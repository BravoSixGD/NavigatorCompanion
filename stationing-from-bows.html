<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Stationing from Bows</title>

  <link rel="stylesheet" href="assets/theme.css">

  <style>
    .input-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .section-subtitle {
      font-size: clamp(16px, 3vw, 19px);
      font-weight: bold;
      color: var(--text-main);
      margin: 0 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-soft);
    }

    .input-section {
      margin-bottom: 18px;
    }

    .unit-row {
      display: grid;
      grid-template-columns: 1fr 0.55fr;
      gap: 10px;
      align-items: end;
    }

    .advance-transfer-row {
      display: grid;
      grid-template-columns: 1fr 1fr 0.65fr;
      gap: 10px;
      align-items: end;
    }

    .time-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .output-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .output-box {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 12px;
      padding: 14px;
      line-height: 1.5;
    }

    .output-label {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 5px;
    }

    .output-value {
      font-size: clamp(18px, 4vw, 25px);
      font-weight: bold;
      color: var(--text-main);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .action-btn {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 18px;
      font-weight: bold;
      background: var(--primary);
      cursor: pointer;
    }

    .action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    .graph-scroll {
      width: 100%;
      overflow: auto;
      margin-top: 16px;
      border: 1px solid var(--border-main);
      border-radius: 12px;
      background: var(--bg-input);
      padding: 10px;
    }

    .a4-sheet {
      width: 210mm;
      height: 297mm;
      background: #dff2d8;
      margin: 0 auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.45);
    }

    .station-svg {
      display: block;
      width: 210mm;
      height: 297mm;
      background: #dff2d8;
    }

    @media (min-width: 760px) {
      .input-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .output-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .action-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      body {
        background: white;
        padding: 0;
        margin: 0;
      }

      body * {
        visibility: hidden;
      }

      #printArea,
      #printArea * {
        visibility: visible;
      }

      #printArea {
        position: fixed;
        left: 0;
        top: 0;
        width: 210mm;
        height: 297mm;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background: #dff2d8;
        box-shadow: none;
      }

      .a4-sheet {
        width: 210mm;
        height: 297mm;
        margin: 0;
        box-shadow: none;
      }

      .station-svg {
        width: 210mm;
        height: 297mm;
      }
    }
  </style>
</head>

<body>
  <a href="index.html" class="home-btn" aria-label="Back to home">×</a>

  <div class="app-container">
    <h1 class="page-title">Stationing from Bows</h1>

    <div class="card">
      <div class="card-title">Initial CTS Calculation</div>

      <div class="input-section">
        <div class="section-subtitle">Guide Ship Data</div>

        <div class="input-grid">
          <div>
            <label>Guide ship's course</label>
            <input id="guideCourse" class="basic-input" type="number" inputmode="decimal" step="0.1" placeholder="090">
          </div>

          <div>
            <label>Guide ship's speed in knots</label>
            <input id="guideSpeed" class="basic-input" type="number" inputmode="decimal" step="0.1" placeholder="12">
          </div>
        </div>
      </div>

      <div class="input-section">
        <div class="section-subtitle">Own Final Station from Guide</div>

        <div class="input-grid">
          <div>
            <label>Final station bearing from guide</label>
            <input id="finalBearing" class="basic-input" type="number" inputmode="decimal" step="0.1" placeholder="180">
          </div>

          <div>
            <label>Final station range from guide in cables</label>
            <input id="finalRange" class="basic-input" type="number" inputmode="decimal" step="0.1" placeholder="5">
          </div>
        </div>
      </div>

      <div class="input-section">
        <div class="section-subtitle">Own Current Position from Guide</div>

        <div class="input-grid">
          <div>
            <label>Current position bearing from guide</label>
            <input id="currentBearing" class="basic-input" type="number" inputmode="decimal" step="0.1" placeholder="130">
          </div>

          <div>
            <label>Current position range from guide in cables</label>
            <input id="currentRange" class="basic-input" type="number" inputmode="decimal" step="0.1" placeholder="12">
          </div>
        </div>
      </div>

      <div class="input-section">
        <div class="section-subtitle">Own Ship Data</div>

        <div class="input-grid">
          <div>
            <label>Own speed in knots</label>
            <input id="ownSpeed" class="basic-input" type="number" inputmode="decimal" step="0.1" placeholder="15">
          </div>
        </div>
      </div>

      <button id="ctsBtn" class="go-btn" type="button">
        CALCULATE CTS
      </button>

      <div id="ctsResult" class="result">
        Enter initial values to calculate CTS.
      </div>

      <div id="constructionSection" class="hidden">
        <div class="card-title" style="margin-top:22px;">Turn and Construction Data</div>

        <div class="input-section">
          <div class="input-grid">
            <div>
              <label>Wheel used in degrees</label>
              <input id="wheelUsed" class="construction-input" type="number" inputmode="decimal" step="0.1" placeholder="15">
            </div>

            <div class="advance-transfer-row">
              <div>
                <label>Advance</label>
                <input id="advance" class="construction-input" type="number" inputmode="decimal" step="0.1" placeholder="4">
              </div>

              <div>
                <label>Transfer</label>
                <input id="transfer" class="construction-input" type="number" inputmode="decimal" step="0.1" placeholder="2">
              </div>

              <div>
                <label>Unit</label>
                <select id="advTransferUnit" class="construction-input">
                  <option value="cables">cables</option>
                  <option value="yards">yards</option>
                </select>
              </div>
            </div>

            <div class="unit-row">
              <div>
                <label>Safety margin</label>
                <input id="safetyMargin" class="construction-input" type="number" inputmode="decimal" step="0.1" placeholder="50">
              </div>

              <div>
                <label>Unit</label>
                <select id="safetyUnit" class="construction-input">
                  <option value="metres">metres</option>
                  <option value="yards">yards</option>
                  <option value="cables">cables</option>
                </select>
              </div>
            </div>

            <div class="time-row">
              <div>
                <label>Time of turn minutes</label>
                <input id="turnMinutes" class="construction-input" type="number" inputmode="numeric" step="1" placeholder="2">
              </div>

              <div>
                <label>Time of turn seconds</label>
                <input id="turnSeconds" class="construction-input" type="number" inputmode="numeric" step="1" placeholder="30">
              </div>
            </div>

            <div id="surgeBox" class="hidden">
              <label>Surge rate in yards per knot</label>
              <input id="surgeRate" class="construction-input" type="number" inputmode="decimal" step="0.1" placeholder="80">
            </div>

            <div id="accelerationBox" class="hidden">
              <label>Acceleration rate in yards per knot</label>
              <input id="accelerationRate" class="construction-input" type="number" inputmode="decimal" step="0.1" placeholder="80">
            </div>
          </div>
        </div>

        <button id="graphBtn" class="go-btn" type="button">
          PLOT GRAPH
        </button>

        <div class="action-grid">
          <button id="printBtn" class="action-btn" type="button" disabled>
            Print A4 Graph
          </button>

          <button id="saveBtn" class="action-btn" type="button" disabled>
            Save as Image
          </button>
        </div>
      </div>

      <div id="result" class="result hidden"></div>
    </div>
  </div>

  <script>
    "use strict";

    const YARDS_PER_NM = 2025.3718285;
    const METRES_PER_NM = 1852;

    const ctsBtn = document.getElementById("ctsBtn");
    const graphBtn = document.getElementById("graphBtn");
    const printBtn = document.getElementById("printBtn");
    const saveBtn = document.getElementById("saveBtn");

    const ctsResult = document.getElementById("ctsResult");
    const resultBox = document.getElementById("result");
    const constructionSection = document.getElementById("constructionSection");
    const surgeBox = document.getElementById("surgeBox");
    const accelerationBox = document.getElementById("accelerationBox");

    let latestData = null;
    let latestSolution = null;
    let latestTurnInfo = null;

    const basicInputIds = [
      "guideCourse",
      "guideSpeed",
      "finalBearing",
      "finalRange",
      "currentBearing",
      "currentRange",
      "ownSpeed"
    ];

    const constructionInputIds = [
      "wheelUsed",
      "advance",
      "transfer",
      "safetyMargin",
      "turnMinutes",
      "turnSeconds"
    ];

    document.querySelectorAll(".basic-input").forEach((control) => {
      control.addEventListener("input", handleBasicInputChange);
    });

    document.querySelectorAll(".construction-input").forEach((control) => {
      control.addEventListener("input", updateGraphButton);
      control.addEventListener("change", updateGraphButton);
    });

    ctsBtn.addEventListener("click", calculateCTS);
    graphBtn.addEventListener("click", calculateGraph);
    printBtn.addEventListener("click", printGraph);
    saveBtn.addEventListener("click", saveGraphAsImage);

    function handleBasicInputChange() {
      latestData = null;
      latestSolution = null;
      latestTurnInfo = null;

      constructionSection.classList.add("hidden");
      resultBox.classList.add("hidden");
      resultBox.innerHTML = "";

      printBtn.disabled = true;
      saveBtn.disabled = true;

      updateCTSButton();
      updateGraphButton();
    }

    function readNumber(id) {
      const text = document.getElementById(id).value.trim();
      return text === "" ? Number.NaN : Number(text);
    }

    function getInputs() {
      return {
        guideCourse: readNumber("guideCourse"),
        guideSpeed: readNumber("guideSpeed"),
        finalBearing: readNumber("finalBearing"),
        finalRangeCables: readNumber("finalRange"),
        currentBearing: readNumber("currentBearing"),
        currentRangeCables: readNumber("currentRange"),
        ownSpeed: readNumber("ownSpeed")
      };
    }

    function getConstructionInputs() {
      return {
        wheelUsed: readNumber("wheelUsed"),
        advance: readNumber("advance"),
        transfer: readNumber("transfer"),
        advTransferUnit: document.getElementById("advTransferUnit").value,
        safetyMargin: readNumber("safetyMargin"),
        safetyUnit: document.getElementById("safetyUnit").value,
        turnMinutes: readNumber("turnMinutes"),
        turnSeconds: readNumber("turnSeconds"),
        surgeRate: readNumber("surgeRate"),
        accelerationRate: readNumber("accelerationRate")
      };
    }

    function degToRad(degrees) {
      return degrees * Math.PI / 180;
    }

    function radToDeg(radians) {
      return radians * 180 / Math.PI;
    }

    function normalizeBearing(value) {
      return ((value % 360) + 360) % 360;
    }

    function formatNumber(value, decimals = 2) {
      return Number(value).toFixed(decimals);
    }

    function trimNumber(value, decimals = 1) {
      return Number(value)
        .toFixed(decimals)
        .replace(/\.0$/, "");
    }

    function formatBearingHalfDegree(value) {
      let rounded = Math.round(normalizeBearing(value) * 2) / 2;

      if (rounded >= 360) {
        rounded = 0;
      }

      const whole = Math.floor(rounded);
      const decimal = Number.isInteger(rounded) ? ".0" : ".5";

      return `${String(whole).padStart(3, "0")}${decimal}°`;
    }

    function formatAngleHalf(value) {
      const rounded = Math.round(Math.abs(value) * 2) / 2;
      return `${formatNumber(rounded, 1)}°`;
    }

    function roundUpToHalf(value) {
      return Math.ceil(value * 2) / 2;
    }

    function unitShort(unit) {
      if (unit === "metres") return "m";
      if (unit === "yards") return "yds";
      return "C";
    }

    function formatInputDistance(value, unit) {
      return `${trimNumber(value, 1)}${unitShort(unit)}`;
    }

    function vectorFromBearingAndDistance(bearing, distanceNm) {
      const radians = degToRad(bearing);

      return {
        east: distanceNm * Math.sin(radians),
        north: distanceNm * Math.cos(radians)
      };
    }

    function velocityFromCourseAndSpeed(course, speed) {
      const radians = degToRad(course);

      return {
        east: speed * Math.sin(radians),
        north: speed * Math.cos(radians)
      };
    }

    function bearingFromVector(east, north) {
      return normalizeBearing(radToDeg(Math.atan2(east, north)));
    }

    function magnitude(east, north) {
      return Math.sqrt((east * east) + (north * north));
    }

    function dot(a, b) {
      return (a.east * b.east) + (a.north * b.north);
    }

    function add(a, b) {
      return {
        east: a.east + b.east,
        north: a.north + b.north
      };
    }

    function subtract(a, b) {
      return {
        east: a.east - b.east,
        north: a.north - b.north
      };
    }

    function multiply(vector, factor) {
      return {
        east: vector.east * factor,
        north: vector.north * factor
      };
    }

    function unitVector(vector) {
      const length = magnitude(vector.east, vector.north);

      if (length < 0.000001) {
        return {
          east: 0,
          north: 0
        };
      }

      return {
        east: vector.east / length,
        north: vector.north / length
      };
    }

    function distanceToNm(value, unit) {
      if (unit === "yards") {
        return value / YARDS_PER_NM;
      }

      if (unit === "metres") {
        return value / METRES_PER_NM;
      }

      return value * 0.1;
    }

    function getBasicValidationMessage() {
      const data = getInputs();

      for (const id of basicInputIds) {
        const value = readNumber(id);

        if (!Number.isFinite(value)) {
          return "Complete all initial input fields.";
        }
      }

      if (data.guideCourse < 0 || data.guideCourse >= 360) {
        return "Guide ship's course must be from 000 to 359.";
      }

      if (data.finalBearing < 0 || data.finalBearing >= 360) {
        return "Final station bearing must be from 000 to 359.";
      }

      if (data.currentBearing < 0 || data.currentBearing >= 360) {
        return "Current position bearing must be from 000 to 359.";
      }

      if (data.guideSpeed <= 0) {
        return "Recheck guide ship's speed.";
      }

      if (data.ownSpeed <= 0) {
        return "Recheck own speed.";
      }

      if (data.finalRangeCables < 0) {
        return "Recheck final station range.";
      }

      if (data.currentRangeCables < 0) {
        return "Recheck current position range.";
      }

      return "";
    }

    function getConstructionValidationMessage() {
      if (!latestData || !latestSolution) {
        return "Calculate CTS first.";
      }

      const construction = getConstructionInputs();

      for (const id of constructionInputIds) {
        const value = readNumber(id);

        if (!Number.isFinite(value)) {
          return "Complete all turn and construction fields.";
        }
      }

      if (construction.wheelUsed <= 0 || construction.wheelUsed > 45) {
        return "Wheel used must be more than 0° and not more than 45°.";
      }

      if (construction.advance < 0) {
        return "Recheck advance.";
      }

      if (construction.transfer < 0) {
        return "Recheck transfer.";
      }

      if (construction.safetyMargin < 0) {
        return "Recheck safety margin.";
      }

      if (construction.turnMinutes < 0) {
        return "Recheck turn minutes.";
      }

      if (construction.turnSeconds < 0 || construction.turnSeconds >= 60) {
        return "Turn seconds must be from 0 to 59.";
      }

      if ((construction.turnMinutes * 60) + construction.turnSeconds <= 0) {
        return "Time of turn must be more than zero.";
      }

      if (latestData.ownSpeed > latestData.guideSpeed) {
        if (!Number.isFinite(construction.surgeRate)) {
          return "Enter surge rate.";
        }

        if (construction.surgeRate < 0) {
          return "Recheck surge rate.";
        }

        const correctionNm =
          (construction.surgeRate * (latestData.ownSpeed - latestData.guideSpeed)) /
          YARDS_PER_NM;

        const advanceNm = distanceToNm(
          construction.advance,
          construction.advTransferUnit
        );

        if (correctionNm > advanceNm) {
          return "Surge correction is greater than advance. F1 will not lie between D and E.";
        }
      }

      if (latestData.ownSpeed < latestData.guideSpeed) {
        if (!Number.isFinite(construction.accelerationRate)) {
          return "Enter acceleration rate.";
        }

        if (construction.accelerationRate < 0) {
          return "Recheck acceleration rate.";
        }
      }

      return "";
    }

    function updateCTSButton() {
      ctsBtn.classList.toggle(
        "valid",
        getBasicValidationMessage() === ""
      );
    }

    function updateGraphButton() {
      graphBtn.classList.toggle(
        "valid",
        !constructionSection.classList.contains("hidden") &&
        getConstructionValidationMessage() === ""
      );
    }

    function calculateStationing(data) {
      const guideVelocity = velocityFromCourseAndSpeed(
        data.guideCourse,
        data.guideSpeed
      );

      const currentPosition = vectorFromBearingAndDistance(
        data.currentBearing,
        data.currentRangeCables * 0.1
      );

      const finalPosition = vectorFromBearingAndDistance(
        data.finalBearing,
        data.finalRangeCables * 0.1
      );

      const relativeDisplacement = subtract(
        finalPosition,
        currentPosition
      );

      const relativeDistanceNm = magnitude(
        relativeDisplacement.east,
        relativeDisplacement.north
      );

      const relativeTrackUnit = unitVector(relativeDisplacement);

      if (relativeDistanceNm < 0.000001) {
        return {
          alreadyThere: true
        };
      }

      const guideAlongRelativeTrack = dot(
        guideVelocity,
        relativeTrackUnit
      );

      const discriminant =
        (guideAlongRelativeTrack * guideAlongRelativeTrack) +
        (data.ownSpeed * data.ownSpeed) -
        (data.guideSpeed * data.guideSpeed);

      let minimumSpeed;

      if (guideAlongRelativeTrack < 0) {
        minimumSpeed = Math.sqrt(
          Math.max(
            0,
            (data.guideSpeed * data.guideSpeed) -
            (guideAlongRelativeTrack * guideAlongRelativeTrack)
          )
        );
      } else {
        minimumSpeed = data.guideSpeed;
      }

      if (discriminant < -0.000001) {
        return {
          possible: false,
          minimumSpeedText: `${formatNumber(roundUpToHalf(minimumSpeed), 1)} kn`
        };
      }

      const sqrtDiscriminant = Math.sqrt(
        Math.max(0, discriminant)
      );

      const root1 =
        -guideAlongRelativeTrack + sqrtDiscriminant;

      const root2 =
        -guideAlongRelativeTrack - sqrtDiscriminant;

      const positiveRoots = [root1, root2]
        .filter((value) => value > 0.000001);

      if (positiveRoots.length === 0) {
        return {
          possible: false,
          minimumSpeedText: `${formatNumber(roundUpToHalf(minimumSpeed), 1)} kn`
        };
      }

      const relativeSpeed = Math.max(...positiveRoots);

      const ownVelocity = add(
        guideVelocity,
        multiply(relativeTrackUnit, relativeSpeed)
      );

      const courseToSteer = bearingFromVector(
        ownVelocity.east,
        ownVelocity.north
      );

      return {
        possible: true,
        courseToSteer
      };
    }

    function calculateShortestTurn(fromCourse, toCourse) {
      const clockwise = normalizeBearing(toCourse - fromCourse);

      if (clockwise === 0) {
        return {
          angle: 0,
          direction: "No turn"
        };
      }

      if (clockwise <= 180) {
        return {
          angle: clockwise,
          direction: "Starboard"
        };
      }

      return {
        angle: 360 - clockwise,
        direction: "Port"
      };
    }

    function getCourseUnits(course) {
      const along = vectorFromBearingAndDistance(course, 1);

      return {
        along,

        starboard: {
          east: along.north,
          north: -along.east
        },

        port: {
          east: -along.north,
          north: along.east
        }
      };
    }

    function angleBetweenVectors(a, b) {
      const magA = magnitude(a.east, a.north);
      const magB = magnitude(b.east, b.north);

      if (magA < 0.000001 || magB < 0.000001) {
        return 0;
      }

      let cosine = dot(a, b) / (magA * magB);
      cosine = Math.max(-1, Math.min(1, cosine));

      return radToDeg(Math.acos(cosine));
    }

    function calculateConstruction(data, solution, construction, turnInfo) {
      const A = {
        east: 0,
        north: 0
      };

      const B = vectorFromBearingAndDistance(
        data.finalBearing,
        data.finalRangeCables * 0.1
      );

      const ownCurrent = vectorFromBearingAndDistance(
        data.currentBearing,
        data.currentRangeCables * 0.1
      );

      const AB = subtract(B, A);
      const ABUnit = unitVector(AB);

      const ABStarboard = {
        east: ABUnit.north,
        north: -ABUnit.east
      };

      const ABPort = {
        east: -ABUnit.north,
        north: ABUnit.east
      };

      const currentSide =
        dot(ownCurrent, ABStarboard) >= 0
          ? ABStarboard
          : ABPort;

      const ownUnits = getCourseUnits(solution.courseToSteer);
      const guideUnits = getCourseUnits(data.guideCourse);

      let transferSide = ownUnits.starboard;

      if (turnInfo.direction === "Port") {
        transferSide = ownUnits.port;
      }

      if (turnInfo.direction === "No turn") {
        transferSide = currentSide;
      }

      const safetyNm = distanceToNm(
        construction.safetyMargin,
        construction.safetyUnit
      );

      const advanceNm = distanceToNm(
        construction.advance,
        construction.advTransferUnit
      );

      const transferNm = distanceToNm(
        construction.transfer,
        construction.advTransferUnit
      );

      const turnSeconds =
        (construction.turnMinutes * 60) + construction.turnSeconds;

      const guideRunNm =
        data.guideSpeed * (turnSeconds / 3600);

      const C = add(
        B,
        multiply(currentSide, safetyNm)
      );

      const D = subtract(
        C,
        multiply(transferSide, transferNm)
      );

      const E = subtract(
        D,
        multiply(ownUnits.along, advanceNm)
      );

      let applicableLabel = "E";
      let F = E;
      let correctionLineText = "E = No speed correction";

      if (data.ownSpeed > data.guideSpeed) {
        applicableLabel = "F1";

        const correctionYards =
          construction.surgeRate * (data.ownSpeed - data.guideSpeed);

        const correctionNm =
          correctionYards / YARDS_PER_NM;

        F = add(
          E,
          multiply(ownUnits.along, correctionNm)
        );

        correctionLineText =
          `EF1 = Surge = ${trimNumber(correctionYards, 1)}yds`;
      }

      if (data.ownSpeed < data.guideSpeed) {
        applicableLabel = "F2";

        const correctionYards =
          construction.accelerationRate * (data.guideSpeed - data.ownSpeed);

        const correctionNm =
          correctionYards / YARDS_PER_NM;

        F = subtract(
          E,
          multiply(ownUnits.along, correctionNm)
        );

        correctionLineText =
          `EF2 = Acceleration = ${trimNumber(correctionYards, 1)}yds`;
      }

      const guideRunStart = F;

      const G = add(
        guideRunStart,
        multiply(guideUnits.along, guideRunNm)
      );

      const GB = subtract(B, G);
      const GF = subtract(F, G);
      const GA = subtract(A, G);

      const guideRunLine =
        applicableLabel === "E"
          ? `EG = Guide Run = ${trimNumber(guideRunNm * 10, 2)}C`
          : `${applicableLabel}G = Guide Run = ${trimNumber(guideRunNm * 10, 2)}C`;

      return {
        A,
        B,
        C,
        D,
        E,
        F,
        G,
        applicableLabel,
        angleBGF: angleBetweenVectors(GB, GF),
        bearingAFromG: bearingFromVector(GA.east, GA.north),
        bearingBFromG: bearingFromVector(GB.east, GB.north),
        legendLines: [
          `AB = Final Stn = ${formatBearingHalfDegree(data.finalBearing)} - ${trimNumber(data.finalRangeCables, 1)}C from guide`,
          `BC = Safety Margin = ${formatInputDistance(construction.safetyMargin, construction.safetyUnit)}`,
          `CD = Transfer = ${formatInputDistance(construction.transfer, construction.advTransferUnit)}`,
          `DE = Advance = ${formatInputDistance(construction.advance, construction.advTransferUnit)}`,
          correctionLineText,
          guideRunLine
        ]
      };
    }

    function calculateCTS() {
      const validationMessage = getBasicValidationMessage();

      if (validationMessage !== "") {
        ctsResult.innerHTML =
          `<span class="warning">${validationMessage}</span>`;

        constructionSection.classList.add("hidden");
        resultBox.classList.add("hidden");
        updateCTSButton();
        updateGraphButton();
        return;
      }

      const data = getInputs();
      const solution = calculateStationing(data);

      if (solution.alreadyThere) {
        ctsResult.innerHTML =
          `<span class="warning">Own ship is already at the final station.</span>`;

        constructionSection.classList.add("hidden");
        resultBox.classList.add("hidden");
        return;
      }

      if (!solution.possible) {
        ctsResult.innerHTML = `
          <span class="warning">
            Final station is not possible at the entered own speed.
          </span>

          <div class="output-grid">
            <div class="output-box">
              <div class="output-label">Least speed required</div>
              <div class="output-value">${solution.minimumSpeedText}</div>
            </div>
          </div>
        `;

        constructionSection.classList.add("hidden");
        resultBox.classList.add("hidden");
        return;
      }

      const turnInfo = calculateShortestTurn(
        solution.courseToSteer,
        data.guideCourse
      );

      latestData = data;
      latestSolution = solution;
      latestTurnInfo = turnInfo;

      surgeBox.classList.toggle(
        "hidden",
        !(data.ownSpeed > data.guideSpeed)
      );

      accelerationBox.classList.toggle(
        "hidden",
        !(data.ownSpeed < data.guideSpeed)
      );

      ctsResult.innerHTML = `
        <div class="success">CTS calculated.</div>

        <div class="output-grid">
          <div class="output-box">
            <div class="output-label">Course to steer</div>
            <div class="output-value">${formatBearingHalfDegree(solution.courseToSteer)}</div>
          </div>

          <div class="output-box">
            <div class="output-label">Turn required to steady on guide course</div>
            <div class="output-value">${formatAngleHalf(turnInfo.angle)} ${turnInfo.direction}</div>
          </div>
        </div>
      `;

      constructionSection.classList.remove("hidden");
      resultBox.classList.add("hidden");
      resultBox.innerHTML = "";

      printBtn.disabled = true;
      saveBtn.disabled = true;

      updateCTSButton();
      updateGraphButton();
    }

    function niceCeiling(value) {
      if (value <= 0) return 0.1;

      const exponent = Math.floor(Math.log10(value));
      const base = Math.pow(10, exponent);
      const normal = value / base;

      if (normal <= 1) return 1 * base;
      if (normal <= 2) return 2 * base;
      if (normal <= 5) return 5 * base;

      return 10 * base;
    }

    function makeLine(x1, y1, x2, y2, stroke, width, dash = "") {
      return `
        <line
          x1="${x1}"
          y1="${y1}"
          x2="${x2}"
          y2="${y2}"
          stroke="${stroke}"
          stroke-width="${width}"
          stroke-linecap="round"
          ${dash ? `stroke-dasharray="${dash}"` : ""}
        />
      `;
    }

    function makeText(x, y, text, size, anchor = "middle", fill = "#111") {
      return `
        <text
          x="${x}"
          y="${y}"
          font-size="${size}"
          text-anchor="${anchor}"
          fill="${fill}"
          font-family="Arial, sans-serif"
        >${text}</text>
      `;
    }

    function renderGrid() {
      let grid = `
        <rect
          x="0"
          y="0"
          width="210"
          height="297"
          fill="#dff2d8"
        />
      `;

      for (let x = 0; x <= 210; x += 1) {
        const isMajor = x % 10 === 0;

        grid += makeLine(
          x,
          0,
          x,
          297,
          isMajor ? "#3b873b" : "#91c891",
          isMajor ? 0.18 : 0.06
        );
      }

      for (let y = 0; y <= 297; y += 1) {
        const isMajor = y % 10 === 0;

        grid += makeLine(
          0,
          y,
          210,
          y,
          isMajor ? "#3b873b" : "#91c891",
          isMajor ? 0.18 : 0.06
        );
      }

      return grid;
    }

    function renderCentreArrow(x1, y1, x2, y2, colour) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const length = Math.sqrt((dx * dx) + (dy * dy));

      if (length < 0.001) {
        return "";
      }

      const ux = dx / length;
      const uy = dy / length;

      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2;

      const arrowLength = 1.1;
      const arrowWidth = 0.9;

      const tipX = midX + (ux * arrowLength / 2);
      const tipY = midY + (uy * arrowLength / 2);

      const baseX = midX - (ux * arrowLength / 2);
      const baseY = midY - (uy * arrowLength / 2);

      const perpX = -uy;
      const perpY = ux;

      const leftX = baseX + (perpX * arrowWidth / 2);
      const leftY = baseY + (perpY * arrowWidth / 2);

      const rightX = baseX - (perpX * arrowWidth / 2);
      const rightY = baseY - (perpY * arrowWidth / 2);

      return `
        <polygon
          points="${tipX},${tipY} ${leftX},${leftY} ${rightX},${rightY}"
          fill="${colour}"
          stroke="${colour}"
          stroke-width="0.1"
        />
      `;
    }

    function renderPoint(x, y, label, fill, labelXOffset, labelYOffset) {
      return `
        <circle
          cx="${x}"
          cy="${y}"
          r="0.5"
          fill="${fill}"
          stroke="#111"
          stroke-width="0.15"
        />

        ${makeText(
          x + labelXOffset,
          y + labelYOffset,
          label,
          3.0,
          labelXOffset >= 0 ? "start" : "end",
          "#111"
        )}
      `;
    }

    function renderLegend(build) {
      let legend = makeText(12, 24, "Legend", 3.4, "start", "#111");

      build.legendLines.forEach((line, index) => {
        legend += makeText(
          12,
          30 + (index * 5),
          line,
          3.0,
          "start",
          "#111"
        );
      });

      return legend;
    }

    function renderBottomResults(build) {
      return `
        ${makeText(
          12,
          273,
          `Angle of Aim Point = ${formatAngleHalf(build.angleBGF)}`,
          3.5,
          "start",
          "#111"
        )}

        ${makeText(
          12,
          280,
          `True Bearing of A from G = ${formatBearingHalfDegree(build.bearingAFromG)}`,
          3.5,
          "start",
          "#111"
        )}
      `;
    }

    function renderConstructionGraph(build) {
      const a4WidthMm = 210;
      const a4HeightMm = 297;
      const paddingMm = 14;

      const usableWidthCm = (a4WidthMm - (2 * paddingMm)) / 10;
      const usableHeightCm = (a4HeightMm - (2 * paddingMm)) / 10;

      const points = [
        build.A,
        build.B,
        build.C,
        build.D,
        build.E,
        build.F,
        build.G
      ];

      let minEast = Math.min(...points.map(p => p.east));
      let maxEast = Math.max(...points.map(p => p.east));
      let minNorth = Math.min(...points.map(p => p.north));
      let maxNorth = Math.max(...points.map(p => p.north));

      const widthNm = Math.max(0.1, maxEast - minEast);
      const heightNm = Math.max(0.1, maxNorth - minNorth);

      const marginNm = Math.max(
        0.2,
        Math.max(widthNm, heightNm) * 0.22
      );

      minEast -= marginNm;
      maxEast += marginNm;
      minNorth -= marginNm;
      maxNorth += marginNm;

      const graphWidthNm = maxEast - minEast;
      const graphHeightNm = maxNorth - minNorth;

      const scaleNmPerCm = niceCeiling(
        Math.max(
          graphWidthNm / usableWidthCm,
          graphHeightNm / usableHeightCm
        ) * 1.03
      );

      const contentWidthMm = (graphWidthNm / scaleNmPerCm) * 10;
      const contentHeightMm = (graphHeightNm / scaleNmPerCm) * 10;

      const offsetX = (a4WidthMm - contentWidthMm) / 2;
      const offsetY = (a4HeightMm - contentHeightMm) / 2;

      function x(east) {
        return offsetX + ((east - minEast) / scaleNmPerCm) * 10;
      }

      function y(north) {
        return offsetY + ((maxNorth - north) / scaleNmPerCm) * 10;
      }

      const AX = x(build.A.east);
      const AY = y(build.A.north);

      const BX = x(build.B.east);
      const BY = y(build.B.north);

      const CX = x(build.C.east);
      const CY = y(build.C.north);

      const DX = x(build.D.east);
      const DY = y(build.D.north);

      const EX = x(build.E.east);
      const EY = y(build.E.north);

      const FX = x(build.F.east);
      const FY = y(build.F.north);

      const GX = x(build.G.east);
      const GY = y(build.G.north);

      const northArrowX = 186;
      const northArrowY1 = 34;
      const northArrowY2 = 18;

      const correctionLine =
        build.applicableLabel !== "E"
          ? `
            ${makeLine(EX, EY, FX, FY, "#8a1a1a", 0.5)}
            ${renderCentreArrow(EX, EY, FX, FY, "#8a1a1a")}
          `
          : "";

      const applicablePoint =
        build.applicableLabel !== "E"
          ? renderPoint(FX, FY, build.applicableLabel, "#8a1a1a", 3, -3)
          : "";

      const svg = `
        <svg
          id="stationSvg"
          class="station-svg"
          xmlns="http://www.w3.org/2000/svg"
          width="210mm"
          height="297mm"
          viewBox="0 0 210 297"
        >
          ${renderGrid()}

          ${makeText(12, 10, `Scale: 1 cm = ${formatNumber(scaleNmPerCm, 3)} NM`, 4, "start")}
          ${makeText(12, 16, `1 mm = ${formatNumber(scaleNmPerCm / 10, 3)} NM`, 3.2, "start")}

          ${renderLegend(build)}

          ${makeLine(northArrowX, northArrowY1, northArrowX, northArrowY2, "#111", 0.5)}
          ${renderCentreArrow(northArrowX, northArrowY1, northArrowX, northArrowY2, "#111")}
          ${makeText(northArrowX, northArrowY2 - 3, "N", 4, "middle")}

          ${makeLine(AX, AY, BX, BY, "#111", 0.5)}
          ${renderCentreArrow(AX, AY, BX, BY, "#111")}

          ${makeLine(BX, BY, CX, CY, "#7a4b00", 0.5)}
          ${renderCentreArrow(BX, BY, CX, CY, "#7a4b00")}

          ${makeLine(CX, CY, DX, DY, "#0b4fbd", 0.5)}
          ${renderCentreArrow(CX, CY, DX, DY, "#0b4fbd")}

          ${makeLine(DX, DY, EX, EY, "#0b4fbd", 0.5)}
          ${renderCentreArrow(DX, DY, EX, EY, "#0b4fbd")}

          ${correctionLine}

          ${makeLine(FX, FY, GX, GY, "#111", 0.5)}
          ${renderCentreArrow(FX, FY, GX, GY, "#111")}

          ${makeLine(GX, GY, BX, BY, "#8a1a1a", 0.5, "2 2")}
          ${makeText(
            (GX + BX) / 2,
            (GY + BY) / 2 - 3,
            `G to B ${formatBearingHalfDegree(build.bearingBFromG)}`,
            3,
            "middle",
            "#8a1a1a"
          )}

          ${makeLine(GX, GY, AX, AY, "#111", 0.5, "2 2")}
          ${makeText(
            (GX + AX) / 2,
            (GY + AY) / 2 + 4,
            `G to A ${formatBearingHalfDegree(build.bearingAFromG)}`,
            3,
            "middle",
            "#111"
          )}

          ${renderPoint(AX, AY, "A", "#111", 3, -3)}
          ${renderPoint(BX, BY, "B", "#8a1a1a", 3, -3)}
          ${renderPoint(CX, CY, "C", "#7a4b00", 3, -3)}
          ${renderPoint(DX, DY, "D", "#0b4fbd", 3, -3)}
          ${renderPoint(EX, EY, "E", "#0b4fbd", 3, -3)}
          ${applicablePoint}
          ${renderPoint(GX, GY, "G", "#ff8c00", 3, -3)}

          ${renderBottomResults(build)}
        </svg>
      `;

      return {
        svg,
        scaleNmPerCm
      };
    }

    function calculateGraph() {
      const validationMessage = getConstructionValidationMessage();

      if (validationMessage !== "") {
        resultBox.classList.remove("hidden");
        resultBox.innerHTML =
          `<span class="warning">${validationMessage}</span>`;

        printBtn.disabled = true;
        saveBtn.disabled = true;
        updateGraphButton();
        return;
      }

      const constructionInputs = getConstructionInputs();

      const build = calculateConstruction(
        latestData,
        latestSolution,
        constructionInputs,
        latestTurnInfo
      );

      const graph = renderConstructionGraph(build);

      resultBox.classList.remove("hidden");

      resultBox.innerHTML = `
        <div class="success">Stationing graph calculated.</div>

        <div class="output-grid">
          <div class="output-box">
            <div class="output-label">Angle to Aim Point</div>
            <div class="output-value">${formatAngleHalf(build.angleBGF)}</div>
          </div>

          <div class="output-box">
            <div class="output-label">True bearing of A from G</div>
            <div class="output-value">${formatBearingHalfDegree(build.bearingAFromG)}</div>
          </div>
        </div>

        <div class="graph-scroll">
          <div id="printArea" class="a4-sheet">
            ${graph.svg}
          </div>
        </div>
      `;

      printBtn.disabled = false;
      saveBtn.disabled = false;

      updateGraphButton();
    }

    function printGraph() {
      const svg = document.getElementById("stationSvg");

      if (!svg) {
        return;
      }

      window.print();
    }

    function saveGraphAsImage() {
      const svg = document.getElementById("stationSvg");

      if (!svg) {
        return;
      }

      const serializer = new XMLSerializer();
      const svgText = serializer.serializeToString(svg);

      const svgBlob = new Blob(
        [svgText],
        {
          type: "image/svg+xml;charset=utf-8"
        }
      );

      const url = URL.createObjectURL(svgBlob);
      const image = new Image();

      image.onload = function () {
        const canvas = document.createElement("canvas");

        canvas.width = 2480;
        canvas.height = 3508;

        const context = canvas.getContext("2d");

        context.fillStyle = "#dff2d8";
        context.fillRect(0, 0, canvas.width, canvas.height);

        context.drawImage(
          image,
          0,
          0,
          canvas.width,
          canvas.height
        );

        URL.revokeObjectURL(url);

        const pngUrl = canvas.toDataURL("image/png");

        const downloadLink = document.createElement("a");
        downloadLink.href = pngUrl;
        downloadLink.download = "stationing-from-bows-graph.png";

        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      };

      image.src = url;
    }

    updateCTSButton();
    updateGraphButton();
  </script>
</body>
</html>
