<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Stationing from Bows</title>

  <link rel="stylesheet" href="assets/theme.css">

  <style>
    .input-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .section-subtitle {
      font-size: clamp(16px, 3vw, 19px);
      font-weight: bold;
      color: var(--text-main);
      margin: 0 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-soft);
    }

    .input-section {
      margin-bottom: 18px;
    }

    .unit-row {
      display: grid;
      grid-template-columns: 1fr 0.55fr;
      gap: 10px;
      align-items: end;
    }

    .time-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .output-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .output-box {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 12px;
      padding: 14px;
      line-height: 1.5;
    }

    .output-label {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 5px;
    }

    .output-value {
      font-size: clamp(18px, 4vw, 25px);
      font-weight: bold;
      color: var(--text-main);
    }

    .small-note {
      margin-top: 12px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .action-btn {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 18px;
      font-weight: bold;
      background: var(--primary);
      cursor: pointer;
    }

    .action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .graph-scroll {
      width: 100%;
      overflow: auto;
      margin-top: 16px;
      border: 1px solid var(--border-main);
      border-radius: 12px;
      background: var(--bg-input);
      padding: 10px;
    }

    .a4-sheet {
      width: 210mm;
      height: 297mm;
      background: #dff2d8;
      margin: 0 auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.45);
    }

    .station-svg {
      display: block;
      width: 210mm;
      height: 297mm;
      background: #dff2d8;
    }

    @media (min-width: 760px) {
      .input-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .output-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .action-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      body {
        background: white;
        padding: 0;
        margin: 0;
      }

      body * {
        visibility: hidden;
      }

      #printArea,
      #printArea * {
        visibility: visible;
      }

      #printArea {
        position: fixed;
        left: 0;
        top: 0;
        width: 210mm;
        height: 297mm;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background: #dff2d8;
        box-shadow: none;
      }

      .a4-sheet {
        width: 210mm;
        height: 297mm;
        margin: 0;
        box-shadow: none;
      }

      .station-svg {
        width: 210mm;
        height: 297mm;
      }
    }
  </style>
</head>

<body>
  <a
    href="index.html"
    class="home-btn"
    aria-label="Back to home"
  >×</a>

  <div class="app-container">
    <h1 class="page-title">Stationing from Bows</h1>

    <div class="card">
      <div class="card-title">CTS Calculator</div>

      <div class="input-section">
        <div class="section-subtitle">Guide Ship Data</div>

        <div class="input-grid">
          <div>
            <label>Guide ship's course</label>
            <input id="guideCourse" type="number" inputmode="decimal" step="0.1" placeholder="090">
          </div>

          <div>
            <label>Guide ship's speed in knots</label>
            <input id="guideSpeed" type="number" inputmode="decimal" step="0.1" placeholder="12">
          </div>
        </div>
      </div>

      <div class="input-section">
        <div class="section-subtitle">Own Final Station from Guide</div>

        <div class="input-grid">
          <div>
            <label>Final station bearing from guide</label>
            <input id="finalBearing" type="number" inputmode="decimal" step="0.1" placeholder="045">
          </div>

          <div>
            <label>Final station range from guide in cables</label>
            <input id="finalRange" type="number" inputmode="decimal" step="0.1" placeholder="5">
          </div>
        </div>
      </div>

      <div class="input-section">
        <div class="section-subtitle">Own Current Position from Guide</div>

        <div class="input-grid">
          <div>
            <label>Current position bearing from guide</label>
            <input id="currentBearing" type="number" inputmode="decimal" step="0.1" placeholder="120">
          </div>

          <div>
            <label>Current position range from guide in cables</label>
            <input id="currentRange" type="number" inputmode="decimal" step="0.1" placeholder="12">
          </div>
        </div>
      </div>

      <div class="input-section">
        <div class="section-subtitle">Own Ship Data</div>

        <div class="input-grid">
          <div>
            <label>Own speed in knots</label>
            <input id="ownSpeed" type="number" inputmode="decimal" step="0.1" placeholder="15">
          </div>
        </div>
      </div>

      <div class="input-section">
        <div class="section-subtitle">Turn Allowance Data</div>

        <div class="input-grid">
          <div>
            <label>Wheel used in degrees</label>
            <input id="wheelUsed" type="number" inputmode="decimal" step="0.1" placeholder="15">
          </div>

          <div class="unit-row">
            <div>
              <label>Advance</label>
              <input id="advance" type="number" inputmode="decimal" step="0.1" placeholder="4">
            </div>

            <div>
              <label>Unit</label>
              <select id="advTransferUnit">
                <option value="cables">cables</option>
                <option value="yards">yards</option>
              </select>
            </div>
          </div>

          <div>
            <label>Transfer</label>
            <input id="transfer" type="number" inputmode="decimal" step="0.1" placeholder="2">
          </div>

          <div class="time-row">
            <div>
              <label>Time of turn minutes</label>
              <input id="turnMinutes" type="number" inputmode="numeric" step="1" placeholder="2">
            </div>

            <div>
              <label>Time of turn seconds</label>
              <input id="turnSeconds" type="number" inputmode="numeric" step="1" placeholder="30">
            </div>
          </div>

          <div>
            <label>Surge rate of own ship in yards per knot</label>
            <input id="surgeRate" type="number" inputmode="decimal" step="0.1" placeholder="80">
          </div>
        </div>
      </div>

      <button id="goBtn" class="go-btn" type="button">
        GO
      </button>

      <div class="action-grid">
        <button id="printBtn" class="action-btn" type="button" disabled>
          Print A4 Graph
        </button>

        <button id="saveBtn" class="action-btn" type="button" disabled>
          Save as Image
        </button>
      </div>

      <div id="result" class="result">
        Enter values to calculate course to steer and plot movement.
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const YARDS_PER_NM = 2025.3718285;

    const goBtn = document.getElementById("goBtn");
    const printBtn = document.getElementById("printBtn");
    const saveBtn = document.getElementById("saveBtn");
    const resultBox = document.getElementById("result");

    const basicInputIds = [
      "guideCourse",
      "guideSpeed",
      "finalBearing",
      "finalRange",
      "currentBearing",
      "currentRange",
      "ownSpeed"
    ];

    const turnInputIds = [
      "wheelUsed",
      "advance",
      "transfer",
      "turnMinutes",
      "turnSeconds",
      "surgeRate"
    ];

    document
      .querySelectorAll("input, select")
      .forEach((input) => {
        input.addEventListener("input", handleInputChange);
        input.addEventListener("change", handleInputChange);
      });

    goBtn.addEventListener("click", calculate);
    printBtn.addEventListener("click", printGraph);
    saveBtn.addEventListener("click", saveGraphAsImage);

    function handleInputChange() {
      updateButton();
      printBtn.disabled = true;
      saveBtn.disabled = true;
    }

    function readNumber(id) {
      const text = document.getElementById(id).value.trim();

      if (text === "") {
        return Number.NaN;
      }

      return Number(text);
    }

    function getInputs() {
      return {
        guideCourse: readNumber("guideCourse"),
        guideSpeed: readNumber("guideSpeed"),

        finalBearing: readNumber("finalBearing"),
        finalRangeCables: readNumber("finalRange"),

        currentBearing: readNumber("currentBearing"),
        currentRangeCables: readNumber("currentRange"),

        ownSpeed: readNumber("ownSpeed")
      };
    }

    function getTurnInputs() {
      return {
        wheelUsed: readNumber("wheelUsed"),
        advance: readNumber("advance"),
        transfer: readNumber("transfer"),
        unit: document.getElementById("advTransferUnit").value,
        turnMinutes: readNumber("turnMinutes"),
        turnSeconds: readNumber("turnSeconds"),
        surgeRate: readNumber("surgeRate")
      };
    }

    function hasAnyTurnInput() {
      return turnInputIds.some((id) => {
        return document.getElementById(id).value.trim() !== "";
      });
    }

    function degToRad(degrees) {
      return degrees * Math.PI / 180;
    }

    function radToDeg(radians) {
      return radians * 180 / Math.PI;
    }

    function normalizeBearing(value) {
      return ((value % 360) + 360) % 360;
    }

    function formatBearingHalfDegree(value) {
      let rounded = Math.round(normalizeBearing(value) * 2) / 2;

      if (rounded >= 360) {
        rounded = 0;
      }

      const whole = Math.floor(rounded);
      const decimal = Number.isInteger(rounded) ? ".0" : ".5";

      return `${String(whole).padStart(3, "0")}${decimal}°`;
    }

    function formatBearingOneDecimal(value) {
      return `${normalizeBearing(value).toFixed(1).padStart(5, "0")}°`;
    }

    function formatNumber(value, decimals = 2) {
      return Number(value).toFixed(decimals);
    }

    function formatAngleHalf(value) {
      const rounded = Math.round(Math.abs(value) * 2) / 2;
      return `${formatNumber(rounded, 1)}°`;
    }

    function formatHours(hours) {
      const totalMinutes = Math.round(hours * 60);
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;

      return `${formatNumber(hours, 2)} hrs (${h} h ${String(m).padStart(2, "0")} min)`;
    }

    function formatMinSec(totalSeconds) {
      const rounded = Math.round(totalSeconds);
      const minutes = Math.floor(rounded / 60);
      const seconds = rounded % 60;

      return `${minutes} min ${String(seconds).padStart(2, "0")} sec`;
    }

    function roundUpToHalf(value) {
      return Math.ceil(value * 2) / 2;
    }

    function vectorFromBearingAndDistance(bearing, distanceNm) {
      const radians = degToRad(bearing);

      return {
        east: distanceNm * Math.sin(radians),
        north: distanceNm * Math.cos(radians)
      };
    }

    function velocityFromCourseAndSpeed(course, speed) {
      const radians = degToRad(course);

      return {
        east: speed * Math.sin(radians),
        north: speed * Math.cos(radians)
      };
    }

    function bearingFromVector(east, north) {
      return normalizeBearing(radToDeg(Math.atan2(east, north)));
    }

    function magnitude(east, north) {
      return Math.sqrt((east * east) + (north * north));
    }

    function dot(a, b) {
      return (a.east * b.east) + (a.north * b.north);
    }

    function subtract(a, b) {
      return {
        east: a.east - b.east,
        north: a.north - b.north
      };
    }

    function add(a, b) {
      return {
        east: a.east + b.east,
        north: a.north + b.north
      };
    }

    function multiply(vector, factor) {
      return {
        east: vector.east * factor,
        north: vector.north * factor
      };
    }

    function getBasicValidationMessage() {
      const data = getInputs();

      for (const id of basicInputIds) {
        const value = readNumber(id);

        if (!Number.isFinite(value)) {
          return "Complete all basic input fields.";
        }
      }

      if (data.guideCourse < 0 || data.guideCourse >= 360) {
        return "Guide ship's course must be from 000 to 359.";
      }

      if (data.finalBearing < 0 || data.finalBearing >= 360) {
        return "Final station bearing must be from 000 to 359.";
      }

      if (data.currentBearing < 0 || data.currentBearing >= 360) {
        return "Current position bearing must be from 000 to 359.";
      }

      if (data.guideSpeed <= 0) {
        return "Recheck guide ship's speed.";
      }

      if (data.ownSpeed <= 0) {
        return "Recheck own speed.";
      }

      if (data.finalRangeCables < 0) {
        return "Recheck final station range.";
      }

      if (data.currentRangeCables < 0) {
        return "Recheck current position range.";
      }

      return "";
    }

    function getTurnValidationMessage() {
      const turn = getTurnInputs();

      for (const id of turnInputIds) {
        const value = readNumber(id);

        if (!Number.isFinite(value)) {
          return "Complete all turn allowance input fields.";
        }
      }

      if (turn.wheelUsed <= 0 || turn.wheelUsed > 45) {
        return "Wheel used must be more than 0° and not more than 45°.";
      }

      if (turn.advance < 0) {
        return "Recheck advance value.";
      }

      if (turn.transfer < 0) {
        return "Recheck transfer value.";
      }

      if (turn.turnMinutes < 0) {
        return "Recheck turn minutes.";
      }

      if (turn.turnSeconds < 0 || turn.turnSeconds >= 60) {
        return "Turn seconds must be from 0 to 59.";
      }

      if ((turn.turnMinutes * 60) + turn.turnSeconds <= 0) {
        return "Time of turn must be more than zero.";
      }

      if (turn.surgeRate < 0) {
        return "Recheck surge rate.";
      }

      return "";
    }

    function isBasicValid() {
      return getBasicValidationMessage() === "";
    }

    function updateButton() {
      goBtn.classList.toggle("valid", isBasicValid());
    }

    function calculateStationing(data) {
      const guideVelocity = velocityFromCourseAndSpeed(
        data.guideCourse,
        data.guideSpeed
      );

      const currentRangeNm = data.currentRangeCables * 0.1;
      const finalRangeNm = data.finalRangeCables * 0.1;

      const currentPosition = vectorFromBearingAndDistance(
        data.currentBearing,
        currentRangeNm
      );

      const finalPosition = vectorFromBearingAndDistance(
        data.finalBearing,
        finalRangeNm
      );

      const relativeDisplacement = {
        east: finalPosition.east - currentPosition.east,
        north: finalPosition.north - currentPosition.north
      };

      const relativeDistanceNm = magnitude(
        relativeDisplacement.east,
        relativeDisplacement.north
      );

      if (relativeDistanceNm < 0.000001) {
        return {
          alreadyThere: true,
          guideCourse: data.guideCourse,
          guideSpeed: data.guideSpeed
        };
      }

      const relativeTrackUnit = {
        east: relativeDisplacement.east / relativeDistanceNm,
        north: relativeDisplacement.north / relativeDistanceNm
      };

      const guideAlongRelativeTrack = dot(
        guideVelocity,
        relativeTrackUnit
      );

      const discriminant =
        (guideAlongRelativeTrack * guideAlongRelativeTrack) +
        (data.ownSpeed * data.ownSpeed) -
        (data.guideSpeed * data.guideSpeed);

      let minimumSpeed;
      let minimumSpeedText;

      if (guideAlongRelativeTrack < 0) {
        minimumSpeed = Math.sqrt(
          Math.max(
            0,
            (data.guideSpeed * data.guideSpeed) -
            (guideAlongRelativeTrack * guideAlongRelativeTrack)
          )
        );

        minimumSpeedText =
          `${formatNumber(roundUpToHalf(minimumSpeed), 1)} kn`;
      } else {
        minimumSpeed = data.guideSpeed;

        minimumSpeedText =
          `more than ${formatNumber(roundUpToHalf(minimumSpeed), 1)} kn`;
      }

      if (discriminant < -0.000001) {
        return {
          possible: false,
          minimumSpeed,
          minimumSpeedText
        };
      }

      const sqrtDiscriminant = Math.sqrt(
        Math.max(0, discriminant)
      );

      const root1 =
        -guideAlongRelativeTrack + sqrtDiscriminant;

      const root2 =
        -guideAlongRelativeTrack - sqrtDiscriminant;

      const positiveRoots = [root1, root2]
        .filter((value) => value > 0.000001);

      if (positiveRoots.length === 0) {
        return {
          possible: false,
          minimumSpeed,
          minimumSpeedText
        };
      }

      const relativeSpeed = Math.max(...positiveRoots);

      const ownVelocity = {
        east:
          guideVelocity.east +
          (relativeSpeed * relativeTrackUnit.east),

        north:
          guideVelocity.north +
          (relativeSpeed * relativeTrackUnit.north)
      };

      const courseToSteer = bearingFromVector(
        ownVelocity.east,
        ownVelocity.north
      );

      const timeHours = relativeDistanceNm / relativeSpeed;
      const ownDistanceNm = data.ownSpeed * timeHours;

      const relativeTrackBearing = bearingFromVector(
        relativeDisplacement.east,
        relativeDisplacement.north
      );

      return {
        possible: true,
        courseToSteer,
        timeHours,
        ownDistanceNm,
        relativeDistanceNm,
        relativeSpeed,
        relativeTrackBearing
      };
    }

    function calculateShortestTurn(fromCourse, toCourse) {
      const clockwise = normalizeBearing(toCourse - fromCourse);

      if (clockwise === 0) {
        return {
          angle: 0,
          direction: "No turn"
        };
      }

      if (clockwise <= 180) {
        return {
          angle: clockwise,
          direction: "Starboard"
        };
      }

      return {
        angle: 360 - clockwise,
        direction: "Port"
      };
    }

    function distanceInputToNm(value, unit) {
      if (unit === "yards") {
        return value / YARDS_PER_NM;
      }

      return value * 0.1;
    }

    function calculateTurnAllowance(data, solution, turnInfo, turnData) {
      const currentPosition = vectorFromBearingAndDistance(
        data.currentBearing,
        data.currentRangeCables * 0.1
      );

      const finalPosition = vectorFromBearingAndDistance(
        data.finalBearing,
        data.finalRangeCables * 0.1
      );

      const ownCourseUnit = vectorFromBearingAndDistance(
        solution.courseToSteer,
        1
      );

      const guideCourseUnit = vectorFromBearingAndDistance(
        data.guideCourse,
        1
      );

      const sideUnit =
        turnInfo.direction === "Port"
          ? {
              east: -ownCourseUnit.north,
              north: ownCourseUnit.east
            }
          : {
              east: ownCourseUnit.north,
              north: -ownCourseUnit.east
            };

      const advanceNm = distanceInputToNm(
        turnData.advance,
        turnData.unit
      );

      const transferNm = distanceInputToNm(
        turnData.transfer,
        turnData.unit
      );

      const turnTotalSeconds =
        (turnData.turnMinutes * 60) + turnData.turnSeconds;

      const turnHours = turnTotalSeconds / 3600;

      const speedAdvantage = Math.max(
        0,
        data.ownSpeed - data.guideSpeed
      );

      const surgeYards =
        turnData.surgeRate * speedAdvantage;

      const surgeNm =
        surgeYards / YARDS_PER_NM;

      const advanceSurgeVector = multiply(
        ownCourseUnit,
        advanceNm + surgeNm
      );

      const transferVector = multiply(
        sideUnit,
        transferNm
      );

      const ownTurnVector = add(
        advanceSurgeVector,
        transferVector
      );

      const guideRunNm =
        data.guideSpeed * turnHours;

      const guideRunVector = multiply(
        guideCourseUnit,
        guideRunNm
      );

      const finalStationAfterTurn = add(
        finalPosition,
        guideRunVector
      );

      const alterPosition = subtract(
        finalStationAfterTurn,
        ownTurnVector
      );

      const alterationToFinalNow = subtract(
        finalPosition,
        alterPosition
      );

      const bearingOfFinalFromAlter = bearingFromVector(
        alterationToFinalNow.east,
        alterationToFinalNow.north
      );

      const rangeOfFinalFromAlterNm = magnitude(
        alterationToFinalNow.east,
        alterationToFinalNow.north
      );

      const ownVelocity = velocityFromCourseAndSpeed(
        solution.courseToSteer,
        data.ownSpeed
      );

      const guideVelocity = velocityFromCourseAndSpeed(
        data.guideCourse,
        data.guideSpeed
      );

      const relativeVelocity = subtract(
        ownVelocity,
        guideVelocity
      );

      const currentToAlter = subtract(
        alterPosition,
        currentPosition
      );

      const relativeVelocitySq =
        (relativeVelocity.east * relativeVelocity.east) +
        (relativeVelocity.north * relativeVelocity.north);

      let timeToAlterHours = Number.NaN;
      let crossTrackNm = Number.NaN;

      if (relativeVelocitySq > 0.000001) {
        timeToAlterHours =
          dot(currentToAlter, relativeVelocity) / relativeVelocitySq;

        const closestPoint = add(
          currentPosition,
          multiply(relativeVelocity, timeToAlterHours)
        );

        crossTrackNm = magnitude(
          alterPosition.east - closestPoint.east,
          alterPosition.north - closestPoint.north
        );
      }

      const approachBearing = bearingFromVector(
        currentToAlter.east,
        currentToAlter.north
      );

      const approachRangeNm = magnitude(
        currentToAlter.east,
        currentToAlter.north
      );

      const advanceTransferUnitText =
        turnData.unit === "yards"
          ? "yards"
          : "cables";

      return {
        currentPosition,
        finalPosition,
        finalStationAfterTurn,
        alterPosition,

        ownCourseUnit,
        guideCourseUnit,
        advanceSurgeVector,
        transferVector,
        ownTurnVector,
        guideRunVector,

        advanceNm,
        transferNm,
        surgeNm,
        surgeYards,
        speedAdvantage,
        guideRunNm,

        turnTotalSeconds,
        bearingOfFinalFromAlter,
        rangeOfFinalFromAlterNm,
        approachBearing,
        approachRangeNm,
        timeToAlterHours,
        crossTrackNm,
        advanceTransferUnitText
      };
    }

    function niceCeiling(value) {
      if (value <= 0) return 0.1;

      const exponent = Math.floor(Math.log10(value));
      const base = Math.pow(10, exponent);
      const normal = value / base;

      if (normal <= 1) return 1 * base;
      if (normal <= 2) return 2 * base;
      if (normal <= 5) return 5 * base;

      return 10 * base;
    }

    function makeLine(x1, y1, x2, y2, stroke, width, dash = "") {
      return `
        <line
          x1="${x1}"
          y1="${y1}"
          x2="${x2}"
          y2="${y2}"
          stroke="${stroke}"
          stroke-width="${width}"
          stroke-linecap="round"
          ${dash ? `stroke-dasharray="${dash}"` : ""}
        />
      `;
    }

    function makeText(x, y, text, size, anchor = "middle", fill = "#111") {
      return `
        <text
          x="${x}"
          y="${y}"
          font-size="${size}"
          text-anchor="${anchor}"
          fill="${fill}"
          font-family="Arial, sans-serif"
        >${text}</text>
      `;
    }

    function renderGrid() {
      let grid = `
        <rect
          x="0"
          y="0"
          width="210"
          height="297"
          fill="#dff2d8"
        />
      `;

      for (let x = 0; x <= 210; x += 1) {
        const isMajor = x % 10 === 0;

        grid += makeLine(
          x,
          0,
          x,
          297,
          isMajor ? "#3b873b" : "#91c891",
          isMajor ? 0.18 : 0.06
        );
      }

      for (let y = 0; y <= 297; y += 1) {
        const isMajor = y % 10 === 0;

        grid += makeLine(
          0,
          y,
          210,
          y,
          isMajor ? "#3b873b" : "#91c891",
          isMajor ? 0.18 : 0.06
        );
      }

      return grid;
    }

    function renderCentreArrow(x1, y1, x2, y2, colour) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const length = Math.sqrt((dx * dx) + (dy * dy));

      if (length < 0.001) {
        return "";
      }

      const ux = dx / length;
      const uy = dy / length;

      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2;

      const arrowLength = 1.1;
      const arrowWidth = 0.9;

      const tipX = midX + (ux * arrowLength / 2);
      const tipY = midY + (uy * arrowLength / 2);

      const baseX = midX - (ux * arrowLength / 2);
      const baseY = midY - (uy * arrowLength / 2);

      const perpX = -uy;
      const perpY = ux;

      const leftX = baseX + (perpX * arrowWidth / 2);
      const leftY = baseY + (perpY * arrowWidth / 2);

      const rightX = baseX - (perpX * arrowWidth / 2);
      const rightY = baseY - (perpY * arrowWidth / 2);

      return `
        <polygon
          points="${tipX},${tipY} ${leftX},${leftY} ${rightX},${rightY}"
          fill="${colour}"
          stroke="${colour}"
          stroke-width="0.1"
        />
      `;
    }

    function renderPoint(x, y, label, fill, labelXOffset, labelYOffset) {
      return `
        <circle
          cx="${x}"
          cy="${y}"
          r="0.5"
          fill="${fill}"
          stroke="#111"
          stroke-width="0.15"
        />

        ${makeText(
          x + labelXOffset,
          y + labelYOffset,
          label,
          3.0,
          labelXOffset >= 0 ? "start" : "end",
          "#111"
        )}
      `;
    }

    function renderMovementGraph(data, solution, turnInfo, turnCalc) {
      const a4WidthMm = 210;
      const a4HeightMm = 297;
      const paddingMm = 14;

      const usableWidthCm = (a4WidthMm - (2 * paddingMm)) / 10;
      const usableHeightCm = (a4HeightMm - (2 * paddingMm)) / 10;

      const guideAtAlter = {
        east: 0,
        north: 0
      };

      const guideAfterTurn = turnCalc.guideRunVector;

      const alterPosition = turnCalc.alterPosition;
      const currentPosition = turnCalc.currentPosition;
      const finalPosition = turnCalc.finalPosition;
      const finalAfterTurn = turnCalc.finalStationAfterTurn;

      const advanceEnd = add(
        alterPosition,
        turnCalc.advanceSurgeVector
      );

      const transferEnd = finalAfterTurn;

      const points = [
        guideAtAlter,
        guideAfterTurn,
        currentPosition,
        finalPosition,
        alterPosition,
        advanceEnd,
        transferEnd,
        finalAfterTurn
      ];

      let minEast = Math.min(...points.map(p => p.east));
      let maxEast = Math.max(...points.map(p => p.east));
      let minNorth = Math.min(...points.map(p => p.north));
      let maxNorth = Math.max(...points.map(p => p.north));

      const widthNm = Math.max(0.1, maxEast - minEast);
      const heightNm = Math.max(0.1, maxNorth - minNorth);

      const marginNm = Math.max(
        0.2,
        Math.max(widthNm, heightNm) * 0.20
      );

      minEast -= marginNm;
      maxEast += marginNm;
      minNorth -= marginNm;
      maxNorth += marginNm;

      const graphWidthNm = maxEast - minEast;
      const graphHeightNm = maxNorth - minNorth;

      const scaleNmPerCm = niceCeiling(
        Math.max(
          graphWidthNm / usableWidthCm,
          graphHeightNm / usableHeightCm
        ) * 1.03
      );

      const contentWidthMm = (graphWidthNm / scaleNmPerCm) * 10;
      const contentHeightMm = (graphHeightNm / scaleNmPerCm) * 10;

      const offsetX = (a4WidthMm - contentWidthMm) / 2;
      const offsetY = (a4HeightMm - contentHeightMm) / 2;

      function x(east) {
        return offsetX + ((east - minEast) / scaleNmPerCm) * 10;
      }

      function y(north) {
        return offsetY + ((maxNorth - north) / scaleNmPerCm) * 10;
      }

      const gX = x(guideAtAlter.east);
      const gY = y(guideAtAlter.north);

      const g2X = x(guideAfterTurn.east);
      const g2Y = y(guideAfterTurn.north);

      const curX = x(currentPosition.east);
      const curY = y(currentPosition.north);

      const altX = x(alterPosition.east);
      const altY = y(alterPosition.north);

      const finalX = x(finalPosition.east);
      const finalY = y(finalPosition.north);

      const finalTurnX = x(finalAfterTurn.east);
      const finalTurnY = y(finalAfterTurn.north);

      const advX = x(advanceEnd.east);
      const advY = y(advanceEnd.north);

      const northArrowX = 186;
      const northArrowY1 = 34;
      const northArrowY2 = 18;

      const svg = `
        <svg
          id="stationSvg"
          class="station-svg"
          xmlns="http://www.w3.org/2000/svg"
          width="210mm"
          height="297mm"
          viewBox="0 0 210 297"
        >
          ${renderGrid()}

          ${makeText(
            12,
            10,
            `Scale: 1 cm = ${formatNumber(scaleNmPerCm, 3)} NM`,
            4,
            "start"
          )}

          ${makeText(
            12,
            16,
            `1 mm = ${formatNumber(scaleNmPerCm / 10, 3)} NM`,
            3.2,
            "start"
          )}

          ${makeText(
            198,
            10,
            "Stationing from Bows",
            4,
            "end"
          )}

          ${makeLine(
            northArrowX,
            northArrowY1,
            northArrowX,
            northArrowY2,
            "#111",
            0.5
          )}

          ${renderCentreArrow(
            northArrowX,
            northArrowY1,
            northArrowX,
            northArrowY2,
            "#111"
          )}

          ${makeText(
            northArrowX,
            northArrowY2 - 3,
            "N",
            4,
            "middle"
          )}

          ${makeLine(
            curX,
            curY,
            altX,
            altY,
            "#0b4fbd",
            0.5,
            "2 2"
          )}

          ${renderCentreArrow(
            curX,
            curY,
            altX,
            altY,
            "#0b4fbd"
          )}

          ${makeText(
            (curX + altX) / 2,
            (curY + altY) / 2 - 3,
            "Approach to alteration",
            3.0,
            "middle",
            "#0b4fbd"
          )}

          ${makeLine(
            altX,
            altY,
            finalX,
            finalY,
            "#8a1a1a",
            0.5,
            "2 2"
          )}

          ${makeText(
            (altX + finalX) / 2,
            (altY + finalY) / 2 + 4,
            `Alter bearing ${formatBearingHalfDegree(turnCalc.bearingOfFinalFromAlter)}`,
            3.0,
            "middle",
            "#8a1a1a"
          )}

          ${makeLine(
            altX,
            altY,
            advX,
            advY,
            "#111",
            0.5
          )}

          ${renderCentreArrow(
            altX,
            altY,
            advX,
            advY,
            "#111"
          )}

          ${makeText(
            (altX + advX) / 2,
            (altY + advY) / 2 - 3,
            "Advance + surge",
            3.0,
            "middle",
            "#111"
          )}

          ${makeLine(
            advX,
            advY,
            finalTurnX,
            finalTurnY,
            "#111",
            0.5
          )}

          ${renderCentreArrow(
            advX,
            advY,
            finalTurnX,
            finalTurnY,
            "#111"
          )}

          ${makeText(
            (advX + finalTurnX) / 2,
            (advY + finalTurnY) / 2 - 3,
            "Transfer",
            3.0,
            "middle",
            "#111"
          )}

          ${makeLine(
            gX,
            gY,
            g2X,
            g2Y,
            "#333",
            0.5
          )}

          ${renderCentreArrow(
            gX,
            gY,
            g2X,
            g2Y,
            "#333"
          )}

          ${makeText(
            (gX + g2X) / 2,
            (gY + g2Y) / 2 - 3,
            "Guide run during turn",
            3.0,
            "middle",
            "#333"
          )}

          ${makeLine(
            gX,
            gY,
            finalX,
            finalY,
            "#555",
            0.5,
            "2 2"
          )}

          ${makeText(
            (gX + finalX) / 2,
            (gY + finalY) / 2 - 3,
            "Final station at alteration",
            2.9,
            "middle",
            "#555"
          )}

          ${makeLine(
            g2X,
            g2Y,
            finalTurnX,
            finalTurnY,
            "#8a1a1a",
            0.5,
            "2 2"
          )}

          ${makeText(
            (g2X + finalTurnX) / 2,
            (g2Y + finalTurnY) / 2 - 3,
            "Final station after turn",
            2.9,
            "middle",
            "#8a1a1a"
          )}

          ${renderPoint(
            gX,
            gY,
            "Guide",
            "#111",
            3,
            -3
          )}

          ${renderPoint(
            g2X,
            g2Y,
            "Guide after turn",
            "#333",
            3,
            -3
          )}

          ${renderPoint(
            curX,
            curY,
            "Own current",
            "#0b4fbd",
            3,
            -3
          )}

          ${renderPoint(
            altX,
            altY,
            "Alter here",
            "#ff8c00",
            3,
            -3
          )}

          ${renderPoint(
            finalX,
            finalY,
            "Final station now",
            "#8a1a1a",
            3,
            -3
          )}

          ${renderPoint(
            finalTurnX,
            finalTurnY,
            "Own final",
            "#8a1a1a",
            3,
            -3
          )}

          ${renderPoint(
            advX,
            advY,
            "Advance end",
            "#111",
            3,
            -3
          )}

          <rect
            x="12"
            y="263"
            width="105"
            height="25"
            fill="rgba(255,255,255,0.60)"
            stroke="#111"
            stroke-width="0.25"
          />

          <circle cx="17" cy="270" r="0.5" fill="#111" />
          ${makeText(22, 271, "Guide", 3, "start")}

          <circle cx="17" cy="277" r="0.5" fill="#0b4fbd" />
          ${makeText(22, 278, "Own current", 3, "start")}

          <circle cx="60" cy="277" r="0.5" fill="#ff8c00" />
          ${makeText(65, 278, "Alter point", 3, "start")}

          <circle cx="17" cy="284" r="0.5" fill="#8a1a1a" />
          ${makeText(22, 285, "Final station", 3, "start")}
        </svg>
      `;

      return {
        svg,
        scaleNmPerCm
      };
    }

    function showWarning(message) {
      resultBox.innerHTML =
        `<span class="warning">${message}</span>`;

      printBtn.disabled = true;
      saveBtn.disabled = true;
    }

    function renderBasicResult(data, solution, turnInfo) {
      resultBox.innerHTML = `
        <div class="success">Course to steer calculated.</div>

        <div class="output-grid">
          <div class="output-box">
            <div class="output-label">Course to steer</div>
            <div class="output-value">${formatBearingHalfDegree(solution.courseToSteer)}</div>
          </div>

          <div class="output-box">
            <div class="output-label">Turn required to steady on guide course</div>
            <div class="output-value">${formatAngleHalf(turnInfo.angle)} ${turnInfo.direction}</div>
          </div>

          <div class="output-box">
            <div class="output-label">Time to final station by direct CTS</div>
            <div class="output-value">${formatHours(solution.timeHours)}</div>
          </div>

          <div class="output-box">
            <div class="output-label">Relative distance to final station</div>
            <div class="output-value">${formatNumber(solution.relativeDistanceNm, 2)} NM</div>
          </div>
        </div>

        <div class="small-note">
          Enter wheel used, advance, transfer, time of turn and surge rate, then press GO again to calculate alteration position and graph.
        </div>
      `;

      printBtn.disabled = true;
      saveBtn.disabled = true;
    }

    function calculate() {
      const basicValidationMessage = getBasicValidationMessage();

      if (basicValidationMessage !== "") {
        showWarning(basicValidationMessage);
        updateButton();
        return;
      }

      const data = getInputs();
      const solution = calculateStationing(data);

      if (solution.alreadyThere) {
        resultBox.innerHTML = `
          <div class="success">Own ship is already at the final station.</div>

          <div class="output-grid">
            <div class="output-box">
              <div class="output-label">Course to maintain station</div>
              <div class="output-value">${formatBearingHalfDegree(solution.guideCourse)}</div>
            </div>

            <div class="output-box">
              <div class="output-label">Speed to maintain station</div>
              <div class="output-value">${formatNumber(solution.guideSpeed, 2)} kn</div>
            </div>
          </div>
        `;

        printBtn.disabled = true;
        saveBtn.disabled = true;
        updateButton();
        return;
      }

      if (!solution.possible) {
        resultBox.innerHTML = `
          <span class="warning">
            Final station is not possible at the entered own speed.
          </span>

          <div class="output-grid">
            <div class="output-box">
              <div class="output-label">Entered own speed</div>
              <div class="output-value">${formatNumber(data.ownSpeed, 2)} kn</div>
            </div>

            <div class="output-box">
              <div class="output-label">Least speed required</div>
              <div class="output-value">${solution.minimumSpeedText}</div>
            </div>
          </div>
        `;

        printBtn.disabled = true;
        saveBtn.disabled = true;
        updateButton();
        return;
      }

      const turnInfo = calculateShortestTurn(
        solution.courseToSteer,
        data.guideCourse
      );

      if (!hasAnyTurnInput()) {
        renderBasicResult(data, solution, turnInfo);
        updateButton();
        return;
      }

      const turnValidationMessage = getTurnValidationMessage();

      if (turnValidationMessage !== "") {
        renderBasicResult(data, solution, turnInfo);

        resultBox.innerHTML += `
          <div class="small-note warning">
            ${turnValidationMessage}
          </div>
        `;

        printBtn.disabled = true;
        saveBtn.disabled = true;
        updateButton();
        return;
      }

      const turnData = getTurnInputs();

      const turnCalc = calculateTurnAllowance(
        data,
        solution,
        turnInfo,
        turnData
      );

      const graph = renderMovementGraph(
        data,
        solution,
        turnInfo,
        turnCalc
      );

      const timeToAlterText =
        Number.isFinite(turnCalc.timeToAlterHours) &&
        turnCalc.timeToAlterHours >= 0
          ? formatHours(turnCalc.timeToAlterHours)
          : "Not on present approach line";

      const crossTrackText =
        Number.isFinite(turnCalc.crossTrackNm)
          ? `${formatNumber(turnCalc.crossTrackNm * 10, 2)} cables`
          : "Not available";

      resultBox.innerHTML = `
        <div class="success">Alteration position calculated.</div>

        <div class="output-grid">
          <div class="output-box">
            <div class="output-label">Course to steer</div>
            <div class="output-value">${formatBearingHalfDegree(solution.courseToSteer)}</div>
          </div>

          <div class="output-box">
            <div class="output-label">Turn required</div>
            <div class="output-value">${formatAngleHalf(turnInfo.angle)} ${turnInfo.direction}</div>
          </div>

          <div class="output-box">
            <div class="output-label">Alter when final station bears</div>
            <div class="output-value">${formatBearingHalfDegree(turnCalc.bearingOfFinalFromAlter)}</div>
          </div>

          <div class="output-box">
            <div class="output-label">Range of final station at alteration</div>
            <div class="output-value">${formatNumber(turnCalc.rangeOfFinalFromAlterNm * 10, 2)} cables</div>
          </div>

          <div class="output-box">
            <div class="output-label">Time of turn</div>
            <div class="output-value">${formatMinSec(turnCalc.turnTotalSeconds)}</div>
          </div>

          <div class="output-box">
            <div class="output-label">Guide run during turn</div>
            <div class="output-value">${formatNumber(turnCalc.guideRunNm * 10, 2)} cables</div>
          </div>

          <div class="output-box">
            <div class="output-label">Surge allowance</div>
            <div class="output-value">${formatNumber(turnCalc.surgeYards, 1)} yards</div>
          </div>

          <div class="output-box">
            <div class="output-label">Time to alteration on present CTS</div>
            <div class="output-value">${timeToAlterText}</div>
          </div>
        </div>

        <div class="small-note">
          Wheel used: ${formatNumber(turnData.wheelUsed, 1)}°.
          Advance and transfer unit entered: ${turnCalc.advanceTransferUnitText}.
          <br>
          Speed advantage for surge:
          ${formatNumber(turnCalc.speedAdvantage, 2)} kn.
          <br>
          Cross-track difference of calculated alteration point from present CTS line:
          ${crossTrackText}.
        </div>

        <div class="graph-scroll">
          <div id="printArea" class="a4-sheet">
            ${graph.svg}
          </div>
        </div>

        <div class="small-note">
          A4 portrait graph generated. Scale used:
          1 cm = ${formatNumber(graph.scaleNmPerCm, 3)} NM.
        </div>
      `;

      printBtn.disabled = false;
      saveBtn.disabled = false;

      updateButton();
    }

    function printGraph() {
      const svg = document.getElementById("stationSvg");

      if (!svg) {
        showWarning("Generate the graph before printing.");
        return;
      }

      window.print();
    }

    function saveGraphAsImage() {
      const svg = document.getElementById("stationSvg");

      if (!svg) {
        showWarning("Generate the graph before saving.");
        return;
      }

      const serializer = new XMLSerializer();
      const svgText = serializer.serializeToString(svg);

      const svgBlob = new Blob(
        [svgText],
        {
          type: "image/svg+xml;charset=utf-8"
        }
      );

      const url = URL.createObjectURL(svgBlob);
      const image = new Image();

      image.onload = function () {
        const canvas = document.createElement("canvas");

        canvas.width = 2480;
        canvas.height = 3508;

        const context = canvas.getContext("2d");

        context.fillStyle = "#dff2d8";
        context.fillRect(0, 0, canvas.width, canvas.height);

        context.drawImage(
          image,
          0,
          0,
          canvas.width,
          canvas.height
        );

        URL.revokeObjectURL(url);

        const pngUrl = canvas.toDataURL("image/png");

        const downloadLink = document.createElement("a");
        downloadLink.href = pngUrl;
        downloadLink.download = "stationing-from-bows-graph.png";

        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      };

      image.src = url;
    }

    updateButton();
  </script>
</body>
</html>
