<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Stationing from Bows</title>

  <link rel="stylesheet" href="assets/theme.css">

  <style>
    .input-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .section-subtitle {
      font-size: clamp(16px, 3vw, 19px);
      font-weight: bold;
      color: var(--text-main);
      margin: 0 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-soft);
    }

    .input-section {
      margin-bottom: 18px;
    }

    .output-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .output-box {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 12px;
      padding: 14px;
      line-height: 1.5;
    }

    .output-label {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 5px;
    }

    .output-value {
      font-size: clamp(18px, 4vw, 25px);
      font-weight: bold;
      color: var(--text-main);
    }

    .small-note {
      margin-top: 12px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .action-btn {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 18px;
      font-weight: bold;
      background: var(--primary);
      cursor: pointer;
    }

    .action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .graph-scroll {
      width: 100%;
      overflow: auto;
      margin-top: 16px;
      border: 1px solid var(--border-main);
      border-radius: 12px;
      background: var(--bg-input);
      padding: 10px;
    }

    .a4-sheet {
      width: 210mm;
      height: 297mm;
      background: #dff2d8;
      margin: 0 auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.45);
    }

    .station-svg {
      display: block;
      width: 210mm;
      height: 297mm;
      background: #dff2d8;
    }

    @media (min-width: 760px) {
      .input-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .output-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .action-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      body {
        background: white;
        padding: 0;
        margin: 0;
      }

      body * {
        visibility: hidden;
      }

      #printArea,
      #printArea * {
        visibility: visible;
      }

      #printArea {
        position: fixed;
        left: 0;
        top: 0;
        width: 210mm;
        height: 297mm;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background: #dff2d8;
        box-shadow: none;
      }

      .a4-sheet {
        width: 210mm;
        height: 297mm;
        margin: 0;
        box-shadow: none;
      }

      .station-svg {
        width: 210mm;
        height: 297mm;
      }
    }
  </style>
</head>

<body>
  <a
    href="index.html"
    class="home-btn"
    aria-label="Back to home"
  >×</a>

  <div class="app-container">
    <h1 class="page-title">Stationing from Bows</h1>

    <div class="card">
      <div class="card-title">CTS Calculator</div>

      <div class="input-section">
        <div class="section-subtitle">Guide Ship Data</div>

        <div class="input-grid">
          <div>
            <label>Guide ship's course</label>
            <input id="guideCourse" type="number" inputmode="decimal" step="0.1" placeholder="090">
          </div>

          <div>
            <label>Guide ship's speed in knots</label>
            <input id="guideSpeed" type="number" inputmode="decimal" step="0.1" placeholder="12">
          </div>
        </div>
      </div>

      <div class="input-section">
        <div class="section-subtitle">Own Final Station from Guide</div>

        <div class="input-grid">
          <div>
            <label>Final station bearing from guide</label>
            <input id="finalBearing" type="number" inputmode="decimal" step="0.1" placeholder="045">
          </div>

          <div>
            <label>Final station range from guide in cables</label>
            <input id="finalRange" type="number" inputmode="decimal" step="0.1" placeholder="5">
          </div>
        </div>
      </div>

      <div class="input-section">
        <div class="section-subtitle">Own Current Position from Guide</div>

        <div class="input-grid">
          <div>
            <label>Current position bearing from guide</label>
            <input id="currentBearing" type="number" inputmode="decimal" step="0.1" placeholder="120">
          </div>

          <div>
            <label>Current position range from guide in cables</label>
            <input id="currentRange" type="number" inputmode="decimal" step="0.1" placeholder="12">
          </div>
        </div>
      </div>

      <div class="input-section">
        <div class="section-subtitle">Own Ship Data</div>

        <div class="input-grid">
          <div>
            <label>Own speed in knots</label>
            <input id="ownSpeed" type="number" inputmode="decimal" step="0.1" placeholder="15">
          </div>
        </div>
      </div>

      <button id="goBtn" class="go-btn" type="button">
        GO
      </button>

      <div class="action-grid">
        <button id="printBtn" class="action-btn" type="button" disabled>
          Print A4 Graph
        </button>

        <button id="saveBtn" class="action-btn" type="button" disabled>
          Save as Image
        </button>
      </div>

      <div id="result" class="result">
        Enter values to calculate course to steer and plot movement.
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const goBtn = document.getElementById("goBtn");
    const printBtn = document.getElementById("printBtn");
    const saveBtn = document.getElementById("saveBtn");
    const resultBox = document.getElementById("result");

    const inputIds = [
      "guideCourse",
      "guideSpeed",
      "finalBearing",
      "finalRange",
      "currentBearing",
      "currentRange",
      "ownSpeed"
    ];

    document
      .querySelectorAll("input")
      .forEach((input) => {
        input.addEventListener("input", handleInputChange);
      });

    goBtn.addEventListener("click", calculate);
    printBtn.addEventListener("click", printGraph);
    saveBtn.addEventListener("click", saveGraphAsImage);

    function handleInputChange() {
      updateButton();
      printBtn.disabled = true;
      saveBtn.disabled = true;
    }

    function readNumber(id) {
      const text = document.getElementById(id).value.trim();

      if (text === "") {
        return Number.NaN;
      }

      return Number(text);
    }

    function getInputs() {
      return {
        guideCourse: readNumber("guideCourse"),
        guideSpeed: readNumber("guideSpeed"),

        finalBearing: readNumber("finalBearing"),
        finalRangeCables: readNumber("finalRange"),

        currentBearing: readNumber("currentBearing"),
        currentRangeCables: readNumber("currentRange"),

        ownSpeed: readNumber("ownSpeed")
      };
    }

    function degToRad(degrees) {
      return degrees * Math.PI / 180;
    }

    function radToDeg(radians) {
      return radians * 180 / Math.PI;
    }

    function normalizeBearing(value) {
      return ((value % 360) + 360) % 360;
    }

    function formatBearingHalfDegree(value) {
      let rounded = Math.round(normalizeBearing(value) * 2) / 2;

      if (rounded >= 360) {
        rounded = 0;
      }

      const whole = Math.floor(rounded);
      const decimal = Number.isInteger(rounded) ? ".0" : ".5";

      return `${String(whole).padStart(3, "0")}${decimal}°`;
    }

    function formatBearingOneDecimal(value) {
      return `${normalizeBearing(value).toFixed(1).padStart(5, "0")}°`;
    }

    function formatNumber(value, decimals = 2) {
      return Number(value).toFixed(decimals);
    }

    function formatHours(hours) {
      const totalMinutes = Math.round(hours * 60);
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;

      return `${formatNumber(hours, 2)} hrs (${h} h ${String(m).padStart(2, "0")} min)`;
    }

    function roundUpToHalf(value) {
      return Math.ceil(value * 2) / 2;
    }

    function vectorFromBearingAndDistance(bearing, distanceNm) {
      const radians = degToRad(bearing);

      return {
        east: distanceNm * Math.sin(radians),
        north: distanceNm * Math.cos(radians)
      };
    }

    function velocityFromCourseAndSpeed(course, speed) {
      const radians = degToRad(course);

      return {
        east: speed * Math.sin(radians),
        north: speed * Math.cos(radians)
      };
    }

    function bearingFromVector(east, north) {
      return normalizeBearing(radToDeg(Math.atan2(east, north)));
    }

    function magnitude(east, north) {
      return Math.sqrt((east * east) + (north * north));
    }

    function dot(a, b) {
      return (a.east * b.east) + (a.north * b.north);
    }

    function getValidationMessage() {
      const data = getInputs();

      for (const id of inputIds) {
        const value = readNumber(id);

        if (!Number.isFinite(value)) {
          return "Complete all input fields.";
        }
      }

      if (data.guideCourse < 0 || data.guideCourse >= 360) {
        return "Guide ship's course must be from 000 to 359.";
      }

      if (data.finalBearing < 0 || data.finalBearing >= 360) {
        return "Final station bearing must be from 000 to 359.";
      }

      if (data.currentBearing < 0 || data.currentBearing >= 360) {
        return "Current position bearing must be from 000 to 359.";
      }

      if (data.guideSpeed <= 0) {
        return "Recheck guide ship's speed.";
      }

      if (data.ownSpeed <= 0) {
        return "Recheck own speed.";
      }

      if (data.finalRangeCables < 0) {
        return "Recheck final station range.";
      }

      if (data.currentRangeCables < 0) {
        return "Recheck current position range.";
      }

      return "";
    }

    function isValidInput() {
      return getValidationMessage() === "";
    }

    function updateButton() {
      goBtn.classList.toggle("valid", isValidInput());
    }

    function calculateStationing(data) {
      const guideVelocity = velocityFromCourseAndSpeed(
        data.guideCourse,
        data.guideSpeed
      );

      const currentRangeNm = data.currentRangeCables * 0.1;
      const finalRangeNm = data.finalRangeCables * 0.1;

      const currentPosition = vectorFromBearingAndDistance(
        data.currentBearing,
        currentRangeNm
      );

      const finalPosition = vectorFromBearingAndDistance(
        data.finalBearing,
        finalRangeNm
      );

      const relativeDisplacement = {
        east: finalPosition.east - currentPosition.east,
        north: finalPosition.north - currentPosition.north
      };

      const relativeDistanceNm = magnitude(
        relativeDisplacement.east,
        relativeDisplacement.north
      );

      if (relativeDistanceNm < 0.000001) {
        return {
          alreadyThere: true,
          guideCourse: data.guideCourse,
          guideSpeed: data.guideSpeed
        };
      }

      const relativeTrackUnit = {
        east: relativeDisplacement.east / relativeDistanceNm,
        north: relativeDisplacement.north / relativeDistanceNm
      };

      const guideAlongRelativeTrack = dot(
        guideVelocity,
        relativeTrackUnit
      );

      const discriminant =
        (guideAlongRelativeTrack * guideAlongRelativeTrack) +
        (data.ownSpeed * data.ownSpeed) -
        (data.guideSpeed * data.guideSpeed);

      let minimumSpeed;
      let minimumSpeedText;

      if (guideAlongRelativeTrack < 0) {
        minimumSpeed = Math.sqrt(
          Math.max(
            0,
            (data.guideSpeed * data.guideSpeed) -
            (guideAlongRelativeTrack * guideAlongRelativeTrack)
          )
        );

        minimumSpeedText =
          `${formatNumber(roundUpToHalf(minimumSpeed), 1)} kn`;
      } else {
        minimumSpeed = data.guideSpeed;

        minimumSpeedText =
          `more than ${formatNumber(roundUpToHalf(minimumSpeed), 1)} kn`;
      }

      if (discriminant < -0.000001) {
        return {
          possible: false,
          minimumSpeed,
          minimumSpeedText
        };
      }

      const sqrtDiscriminant = Math.sqrt(
        Math.max(0, discriminant)
      );

      const root1 =
        -guideAlongRelativeTrack + sqrtDiscriminant;

      const root2 =
        -guideAlongRelativeTrack - sqrtDiscriminant;

      const positiveRoots = [root1, root2]
        .filter((value) => value > 0.000001);

      if (positiveRoots.length === 0) {
        return {
          possible: false,
          minimumSpeed,
          minimumSpeedText
        };
      }

      const relativeSpeed = Math.max(...positiveRoots);

      const ownVelocity = {
        east:
          guideVelocity.east +
          (relativeSpeed * relativeTrackUnit.east),

        north:
          guideVelocity.north +
          (relativeSpeed * relativeTrackUnit.north)
      };

      const courseToSteer = bearingFromVector(
        ownVelocity.east,
        ownVelocity.north
      );

      const timeHours = relativeDistanceNm / relativeSpeed;
      const ownDistanceNm = data.ownSpeed * timeHours;

      const relativeTrackBearing = bearingFromVector(
        relativeDisplacement.east,
        relativeDisplacement.north
      );

      return {
        possible: true,
        courseToSteer,
        timeHours,
        ownDistanceNm,
        relativeDistanceNm,
        relativeSpeed,
        relativeTrackBearing,
        minimumSpeed,
        minimumSpeedText
      };
    }

    function niceCeiling(value) {
      if (value <= 0) return 0.1;

      const exponent = Math.floor(Math.log10(value));
      const base = Math.pow(10, exponent);
      const normal = value / base;

      if (normal <= 1) return 1 * base;
      if (normal <= 2) return 2 * base;
      if (normal <= 5) return 5 * base;

      return 10 * base;
    }

    function makeLine(x1, y1, x2, y2, stroke, width, dash = "") {
      return `
        <line
          x1="${x1}"
          y1="${y1}"
          x2="${x2}"
          y2="${y2}"
          stroke="${stroke}"
          stroke-width="${width}"
          stroke-linecap="round"
          ${dash ? `stroke-dasharray="${dash}"` : ""}
        />
      `;
    }

    function makeText(x, y, text, size, anchor = "middle", fill = "#111") {
      return `
        <text
          x="${x}"
          y="${y}"
          font-size="${size}"
          text-anchor="${anchor}"
          fill="${fill}"
          font-family="Arial, sans-serif"
        >${text}</text>
      `;
    }

    function makeMidArrow(x1, y1, x2, y2, fill) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const length = Math.sqrt((dx * dx) + (dy * dy));

      if (length < 0.001) {
        return "";
      }

      const ux = dx / length;
      const uy = dy / length;

      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2;

      const arrowLength = 1.2;
      const arrowWidth = 1.0;

      const tipX = midX + (ux * arrowLength * 0.5);
      const tipY = midY + (uy * arrowLength * 0.5);

      const baseX = midX - (ux * arrowLength * 0.5);
      const baseY = midY - (uy * arrowLength * 0.5);

      const nx = -uy;
      const ny = ux;

      const leftX = baseX + (nx * arrowWidth * 0.5);
      const leftY = baseY + (ny * arrowWidth * 0.5);

      const rightX = baseX - (nx * arrowWidth * 0.5);
      const rightY = baseY - (ny * arrowWidth * 0.5);

      return `
        <polygon
          points="${tipX},${tipY} ${leftX},${leftY} ${rightX},${rightY}"
          fill="${fill}"
        />
      `;
    }

    function makeLineWithMidArrow(x1, y1, x2, y2, stroke, width, dash = "") {
      return `
        ${makeLine(x1, y1, x2, y2, stroke, width, dash)}
        ${makeMidArrow(x1, y1, x2, y2, stroke)}
      `;
    }

    function renderGrid() {
      let grid = `
        <rect
          x="0"
          y="0"
          width="210"
          height="297"
          fill="#dff2d8"
        />
      `;

      for (let x = 0; x <= 210; x += 1) {
        const isMajor = x % 10 === 0;

        grid += makeLine(
          x,
          0,
          x,
          297,
          isMajor ? "#3b873b" : "#91c891",
          isMajor ? 0.18 : 0.06
        );
      }

      for (let y = 0; y <= 297; y += 1) {
        const isMajor = y % 10 === 0;

        grid += makeLine(
          0,
          y,
          210,
          y,
          isMajor ? "#3b873b" : "#91c891",
          isMajor ? 0.18 : 0.06
        );
      }

      return grid;
    }

    function renderPoint(x, y, label, fill, labelXOffset, labelYOffset) {
      return `
        <circle
          cx="${x}"
          cy="${y}"
          r="0.5"
          fill="${fill}"
        />

        ${makeText(
          x + labelXOffset,
          y + labelYOffset,
          label,
          3.0,
          labelXOffset >= 0 ? "start" : "end",
          "#111"
        )}
      `;
    }

    function renderMovementGraph(data, solution) {
      const a4WidthMm = 210;
      const a4HeightMm = 297;
      const paddingMm = 14;

      const usableWidthCm = (a4WidthMm - (2 * paddingMm)) / 10;
      const usableHeightCm = (a4HeightMm - (2 * paddingMm)) / 10;

      const currentRangeNm = data.currentRangeCables * 0.1;
      const finalRangeNm = data.finalRangeCables * 0.1;

      const guideStart = {
        east: 0,
        north: 0
      };

      const guideVelocity = velocityFromCourseAndSpeed(
        data.guideCourse,
        data.guideSpeed
      );

      const guideFinal = {
        east: guideStart.east + (guideVelocity.east * solution.timeHours),
        north: guideStart.north + (guideVelocity.north * solution.timeHours)
      };

      const ownCurrent = vectorFromBearingAndDistance(
        data.currentBearing,
        currentRangeNm
      );

      const finalRelativeFromGuide = vectorFromBearingAndDistance(
        data.finalBearing,
        finalRangeNm
      );

      const ownFinal = {
        east: guideFinal.east + finalRelativeFromGuide.east,
        north: guideFinal.north + finalRelativeFromGuide.north
      };

      const points = [
        guideStart,
        guideFinal,
        ownCurrent,
        ownFinal
      ];

      let minEast = Math.min(...points.map(p => p.east));
      let maxEast = Math.max(...points.map(p => p.east));
      let minNorth = Math.min(...points.map(p => p.north));
      let maxNorth = Math.max(...points.map(p => p.north));

      const widthNm = Math.max(0.1, maxEast - minEast);
      const heightNm = Math.max(0.1, maxNorth - minNorth);

      const marginNm = Math.max(
        0.2,
        Math.max(widthNm, heightNm) * 0.18
      );

      minEast -= marginNm;
      maxEast += marginNm;
      minNorth -= marginNm;
      maxNorth += marginNm;

      const graphWidthNm = maxEast - minEast;
      const graphHeightNm = maxNorth - minNorth;

      const scaleNmPerCm = niceCeiling(
        Math.max(
          graphWidthNm / usableWidthCm,
          graphHeightNm / usableHeightCm
        ) * 1.03
      );

      const contentWidthMm = (graphWidthNm / scaleNmPerCm) * 10;
      const contentHeightMm = (graphHeightNm / scaleNmPerCm) * 10;

      const offsetX = (a4WidthMm - contentWidthMm) / 2;
      const offsetY = (a4HeightMm - contentHeightMm) / 2;

      function x(east) {
        return offsetX + ((east - minEast) / scaleNmPerCm) * 10;
      }

      function y(north) {
        return offsetY + ((maxNorth - north) / scaleNmPerCm) * 10;
      }

      const guideStartX = x(guideStart.east);
      const guideStartY = y(guideStart.north);

      const guideFinalX = x(guideFinal.east);
      const guideFinalY = y(guideFinal.north);

      const ownCurrentX = x(ownCurrent.east);
      const ownCurrentY = y(ownCurrent.north);

      const ownFinalX = x(ownFinal.east);
      const ownFinalY = y(ownFinal.north);

      const northArrowX = 186;
      const northArrowY1 = 34;
      const northArrowY2 = 18;

      const movementLineWidth = 1.0;
      const positionLineWidth = 1.0;

      const svg = `
        <svg
          id="stationSvg"
          class="station-svg"
          xmlns="http://www.w3.org/2000/svg"
          width="210mm"
          height="297mm"
          viewBox="0 0 210 297"
        >
          ${renderGrid()}

          ${makeText(
            12,
            10,
            `Scale: 1 cm = ${formatNumber(scaleNmPerCm, 3)} NM`,
            4,
            "start"
          )}

          ${makeText(
            12,
            16,
            `1 mm = ${formatNumber(scaleNmPerCm / 10, 3)} NM`,
            3.2,
            "start"
          )}

          ${makeText(
            198,
            10,
            "Stationing from Bows",
            4,
            "end"
          )}

          ${makeLineWithMidArrow(
            northArrowX,
            northArrowY1,
            northArrowX,
            northArrowY2,
            "#111",
            1.0
          )}

          ${makeText(
            northArrowX,
            northArrowY2 - 3,
            "N",
            4,
            "middle"
          )}

          ${makeLineWithMidArrow(
            guideStartX,
            guideStartY,
            guideFinalX,
            guideFinalY,
            "#111",
            movementLineWidth
          )}

          ${makeText(
            (guideStartX + guideFinalX) / 2,
            (guideStartY + guideFinalY) / 2 - 3,
            "Guide movement",
            3.0,
            "middle"
          )}

          ${makeLineWithMidArrow(
            ownCurrentX,
            ownCurrentY,
            ownFinalX,
            ownFinalY,
            "#0b4fbd",
            movementLineWidth
          )}

          ${makeText(
            (ownCurrentX + ownFinalX) / 2,
            (ownCurrentY + ownFinalY) / 2 + 5,
            `Own CTS ${formatBearingHalfDegree(solution.courseToSteer)}`,
            3.0,
            "middle",
            "#0b4fbd"
          )}

          ${makeLine(
            guideStartX,
            guideStartY,
            ownCurrentX,
            ownCurrentY,
            "#444",
            positionLineWidth,
            "2 2"
          )}

          ${makeText(
            (guideStartX + ownCurrentX) / 2,
            (guideStartY + ownCurrentY) / 2 - 2,
            "Current position from guide",
            2.8,
            "middle",
            "#444"
          )}

          ${makeLine(
            guideFinalX,
            guideFinalY,
            ownFinalX,
            ownFinalY,
            "#8a1a1a",
            positionLineWidth,
            "2 2"
          )}

          ${makeText(
            (guideFinalX + ownFinalX) / 2,
            (guideFinalY + ownFinalY) / 2 - 2,
            "Final station from guide",
            2.8,
            "middle",
            "#8a1a1a"
          )}

          ${renderPoint(
            guideStartX,
            guideStartY,
            "Guide start",
            "#111",
            2,
            -2
          )}

          ${renderPoint(
            guideFinalX,
            guideFinalY,
            "Guide final",
            "#111",
            2,
            -2
          )}

          ${renderPoint(
            ownCurrentX,
            ownCurrentY,
            "Own current",
            "#0b4fbd",
            2,
            -2
          )}

          ${renderPoint(
            ownFinalX,
            ownFinalY,
            "Own final station",
            "#8a1a1a",
            2,
            -2
          )}

          <rect
            x="12"
            y="270"
            width="88"
            height="18"
            fill="rgba(255,255,255,0.55)"
            stroke="#111"
            stroke-width="0.25"
          />

          <circle cx="17" cy="276" r="0.5" fill="#111" />
          ${makeText(22, 277, "Guide ship", 3, "start")}

          <circle cx="17" cy="283" r="0.5" fill="#0b4fbd" />
          ${makeText(22, 284, "Own ship", 3, "start")}

          <circle cx="58" cy="283" r="0.5" fill="#8a1a1a" />
          ${makeText(63, 284, "Final station", 3, "start")}
        </svg>
      `;

      return {
        svg,
        scaleNmPerCm
      };
    }

    function showWarning(message) {
      resultBox.innerHTML =
        `<span class="warning">${message}</span>`;

      printBtn.disabled = true;
      saveBtn.disabled = true;
    }

    function calculate() {
      const validationMessage = getValidationMessage();

      if (validationMessage !== "") {
        showWarning(validationMessage);
        updateButton();
        return;
      }

      const data = getInputs();
      const solution = calculateStationing(data);

      if (solution.alreadyThere) {
        resultBox.innerHTML = `
          <div class="success">Own ship is already at the final station.</div>

          <div class="output-grid">
            <div class="output-box">
              <div class="output-label">Course to maintain station</div>
              <div class="output-value">${formatBearingHalfDegree(solution.guideCourse)}</div>
            </div>

            <div class="output-box">
              <div class="output-label">Speed to maintain station</div>
              <div class="output-value">${formatNumber(solution.guideSpeed, 2)} kn</div>
            </div>
          </div>

          <div class="small-note">
            To remain at the same relative station, own ship must match guide ship's course and speed.
          </div>
        `;

        printBtn.disabled = true;
        saveBtn.disabled = true;
        updateButton();
        return;
      }

      if (!solution.possible) {
        resultBox.innerHTML = `
          <span class="warning">
            Final station is not possible at the entered own speed.
          </span>

          <div class="output-grid">
            <div class="output-box">
              <div class="output-label">Entered own speed</div>
              <div class="output-value">${formatNumber(data.ownSpeed, 2)} kn</div>
            </div>

            <div class="output-box">
              <div class="output-label">Least speed required</div>
              <div class="output-value">${solution.minimumSpeedText}</div>
            </div>
          </div>

          <div class="small-note">
            Increase own speed and recalculate.
          </div>
        `;

        printBtn.disabled = true;
        saveBtn.disabled = true;
        updateButton();
        return;
      }

      const graph = renderMovementGraph(data, solution);

      resultBox.innerHTML = `
        <div class="success">Course to steer calculated.</div>

        <div class="output-grid">
          <div class="output-box">
            <div class="output-label">Course to steer</div>
            <div class="output-value">${formatBearingHalfDegree(solution.courseToSteer)}</div>
          </div>

          <div class="output-box">
            <div class="output-label">Time to final station</div>
            <div class="output-value">${formatHours(solution.timeHours)}</div>
          </div>

          <div class="output-box">
            <div class="output-label">Own distance to run</div>
            <div class="output-value">${formatNumber(solution.ownDistanceNm, 2)} NM</div>
          </div>

          <div class="output-box">
            <div class="output-label">Relative distance to final station</div>
            <div class="output-value">${formatNumber(solution.relativeDistanceNm, 2)} NM</div>
          </div>
        </div>

        <div class="small-note">
          Relative track from current position to final station:
          ${formatBearingOneDecimal(solution.relativeTrackBearing)}.
          <br>
          Relative speed made good:
          ${formatNumber(solution.relativeSpeed, 2)} kn.
          <br>
          Bearings are true bearings. Range conversion used:
          1 cable = 0.1 NM.
        </div>

        <div class="graph-scroll">
          <div id="printArea" class="a4-sheet">
            ${graph.svg}
          </div>
        </div>

        <div class="small-note">
          A4 portrait graph generated. Scale used:
          1 cm = ${formatNumber(graph.scaleNmPerCm, 3)} NM.
        </div>
      `;

      printBtn.disabled = false;
      saveBtn.disabled = false;

      updateButton();
    }

    function printGraph() {
      const svg = document.getElementById("stationSvg");

      if (!svg) {
        showWarning("Generate the graph before printing.");
        return;
      }

      window.print();
    }

    function saveGraphAsImage() {
      const svg = document.getElementById("stationSvg");

      if (!svg) {
        showWarning("Generate the graph before saving.");
        return;
      }

      const serializer = new XMLSerializer();
      const svgText = serializer.serializeToString(svg);

      const svgBlob = new Blob(
        [svgText],
        {
          type: "image/svg+xml;charset=utf-8"
        }
      );

      const url = URL.createObjectURL(svgBlob);
      const image = new Image();

      image.onload = function () {
        const canvas = document.createElement("canvas");

        canvas.width = 2480;
        canvas.height = 3508;

        const context = canvas.getContext("2d");

        context.fillStyle = "#dff2d8";
        context.fillRect(0, 0, canvas.width, canvas.height);

        context.drawImage(
          image,
          0,
          0,
          canvas.width,
          canvas.height
        );

        URL.revokeObjectURL(url);

        const pngUrl = canvas.toDataURL("image/png");

        const downloadLink = document.createElement("a");
        downloadLink.href = pngUrl;
        downloadLink.download = "stationing-from-bows-graph.png";

        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      };

      image.src = url;
    }

    updateButton();
  </script>
</body>
</html>
