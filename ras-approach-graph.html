<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RAS Approach Graph</title>

  <link rel="stylesheet" href="assets/theme.css">

  <style>
    .input-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .section-subtitle {
      font-size: clamp(16px, 3vw, 19px);
      font-weight: bold;
      color: var(--text-main);
      margin: 0 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-soft);
    }

    .input-section {
      margin-bottom: 18px;
    }

    .unit-row {
      display: grid;
      grid-template-columns: 1fr 0.6fr;
      gap: 10px;
      align-items: end;
    }

    .output-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .output-box {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 12px;
      padding: 14px;
      line-height: 1.5;
    }

    .output-label {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 5px;
    }

    .output-value {
      font-size: clamp(18px, 4vw, 25px);
      font-weight: bold;
      color: var(--text-main);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .action-btn {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 18px;
      font-weight: bold;
      background: var(--primary);
      cursor: pointer;
    }

    .action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .graph-scroll {
      width: 100%;
      overflow: auto;
      margin-top: 16px;
      border: 1px solid var(--border-main);
      border-radius: 12px;
      background: var(--bg-input);
      padding: 10px;
    }

    .a4-sheet {
      width: 210mm;
      height: 297mm;
      background: #dff2d8;
      margin: 0 auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.45);
    }

    .ras-svg {
      display: block;
      width: 210mm;
      height: 297mm;
      background: #dff2d8;
    }

    @media (min-width: 760px) {
      .input-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .output-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .action-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      body {
        background: white;
        padding: 0;
        margin: 0;
      }

      body * {
        visibility: hidden;
      }

      #printArea,
      #printArea * {
        visibility: visible;
      }

      #printArea {
        position: fixed;
        left: 0;
        top: 0;
        width: 210mm;
        height: 297mm;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background: #dff2d8;
        box-shadow: none;
      }

      .a4-sheet {
        width: 210mm;
        height: 297mm;
        margin: 0;
        box-shadow: none;
      }

      .ras-svg {
        width: 210mm;
        height: 297mm;
      }
    }
  </style>
</head>

<body>
  <a href="index.html" class="home-btn" aria-label="Back to home">×</a>

  <div class="app-container">
    <h1 class="page-title">RAS Approach Graph</h1>

    <div class="card">
      <div class="card-title">RAS Approach Data</div>

      <div class="input-section">
        <div class="section-subtitle">Delivery Ship Data</div>

        <div class="input-grid">
          <div>
            <label>Delivery ship LOA in metres</label>
            <input id="deliveryLoa" type="number" inputmode="decimal" step="0.1" placeholder="180">
          </div>

          <div>
            <label>Delivery ship beam in metres</label>
            <input id="deliveryBeam" type="number" inputmode="decimal" step="0.1" placeholder="25">
          </div>

          <div>
            <label>Delivery stem to standard position in metres</label>
            <input id="deliveryStandard" type="number" inputmode="decimal" step="0.1" placeholder="70">
          </div>

          <div>
            <label>Delivery stem to RAS point in metres</label>
            <input id="deliveryRas" type="number" inputmode="decimal" step="0.1" placeholder="90">
          </div>
        </div>
      </div>

      <div class="input-section">
        <div class="section-subtitle">Receiving Ship Data</div>

        <div class="input-grid">
          <div>
            <label>Receiving ship LOA in metres</label>
            <input id="receivingLoa" type="number" inputmode="decimal" step="0.1" placeholder="140">
          </div>

          <div>
            <label>Receiving ship beam in metres</label>
            <input id="receivingBeam" type="number" inputmode="decimal" step="0.1" placeholder="20">
          </div>

          <div>
            <label>Receiving stem to standard position in metres</label>
            <input id="receivingStandard" type="number" inputmode="decimal" step="0.1" placeholder="55">
          </div>

          <div>
            <label>Receiving stem to RAS point in metres</label>
            <input id="receivingRas" type="number" inputmode="decimal" step="0.1" placeholder="75">
          </div>
        </div>
      </div>

      <div class="input-section">
        <div class="section-subtitle">Approach Data</div>

        <div class="input-grid">
          <div class="unit-row">
            <div>
              <label>Required lateral separation</label>
              <input id="separation" type="number" inputmode="decimal" step="0.1" placeholder="40">
            </div>

            <div>
              <label>Unit</label>
              <select id="separationUnit">
                <option value="metres">metres</option>
                <option value="feet">feet</option>
              </select>
            </div>
          </div>

          <div>
            <label>Delivery ship RAS speed in knots</label>
            <input id="deliverySpeed" type="number" inputmode="decimal" step="0.1" placeholder="12">
          </div>

          <div>
            <label>Receiving ship approach speed in knots</label>
            <input id="receivingSpeed" type="number" inputmode="decimal" step="0.1" placeholder="15">
          </div>

          <div>
            <label>Surge rate in yards per knot</label>
            <input id="surgeRate" type="number" inputmode="decimal" step="0.1" placeholder="80">
          </div>
        </div>
      </div>

      <button id="goBtn" class="go-btn" type="button">
        GO
      </button>

      <div class="action-grid">
        <button id="printBtn" class="action-btn" type="button" disabled>
          Print A4 Graph
        </button>

        <button id="saveBtn" class="action-btn" type="button" disabled>
          Save as Image
        </button>
      </div>

      <div id="result" class="result">
        Enter values to generate RAS approach graph.
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const METRES_PER_FOOT = 0.3048;
    const METRES_PER_YARD = 0.9144;

    const goBtn = document.getElementById("goBtn");
    const printBtn = document.getElementById("printBtn");
    const saveBtn = document.getElementById("saveBtn");
    const resultBox = document.getElementById("result");

    const inputIds = [
      "deliveryLoa",
      "deliveryBeam",
      "deliveryStandard",
      "deliveryRas",
      "receivingLoa",
      "receivingBeam",
      "receivingStandard",
      "receivingRas",
      "separation",
      "deliverySpeed",
      "receivingSpeed",
      "surgeRate"
    ];

    document.querySelectorAll("input, select").forEach((control) => {
      control.addEventListener("input", handleInputChange);
      control.addEventListener("change", handleInputChange);
    });

    goBtn.addEventListener("click", calculate);
    printBtn.addEventListener("click", printGraph);
    saveBtn.addEventListener("click", saveGraphAsImage);

    function handleInputChange() {
      updateButton();
      printBtn.disabled = true;
      saveBtn.disabled = true;
    }

    function readNumber(id) {
      const text = document.getElementById(id).value.trim();
      return text === "" ? Number.NaN : Number(text);
    }

    function getInputs() {
      return {
        deliveryLoa: readNumber("deliveryLoa"),
        deliveryBeam: readNumber("deliveryBeam"),
        deliveryStandard: readNumber("deliveryStandard"),
        deliveryRas: readNumber("deliveryRas"),

        receivingLoa: readNumber("receivingLoa"),
        receivingBeam: readNumber("receivingBeam"),
        receivingStandard: readNumber("receivingStandard"),
        receivingRas: readNumber("receivingRas"),

        separation: readNumber("separation"),
        separationUnit: document.getElementById("separationUnit").value,

        deliverySpeed: readNumber("deliverySpeed"),
        receivingSpeed: readNumber("receivingSpeed"),
        surgeRate: readNumber("surgeRate")
      };
    }

    function formatNumber(value, decimals = 2) {
      return Number(value).toFixed(decimals);
    }

    function trimNumber(value, decimals = 1) {
      return Number(value)
        .toFixed(decimals)
        .replace(/\.0$/, "");
    }

    function getSeparationMetres(data) {
      if (data.separationUnit === "feet") {
        return data.separation * METRES_PER_FOOT;
      }

      return data.separation;
    }

    function getValidationMessage() {
      const data = getInputs();

      for (const id of inputIds) {
        const value = readNumber(id);

        if (!Number.isFinite(value)) {
          return "Complete all input fields.";
        }
      }

      if (data.deliveryLoa <= 0 || data.receivingLoa <= 0) {
        return "Recheck ship LOA values.";
      }

      if (data.deliveryBeam <= 0 || data.receivingBeam <= 0) {
        return "Recheck ship beam values.";
      }

      if (data.deliveryStandard < 0 || data.deliveryStandard > data.deliveryLoa) {
        return "Delivery standard position must be within delivery ship LOA.";
      }

      if (data.deliveryRas < 0 || data.deliveryRas > data.deliveryLoa) {
        return "Delivery RAS point must be within delivery ship LOA.";
      }

      if (data.receivingStandard < 0 || data.receivingStandard > data.receivingLoa) {
        return "Receiving standard position must be within receiving ship LOA.";
      }

      if (data.receivingRas < 0 || data.receivingRas > data.receivingLoa) {
        return "Receiving RAS point must be within receiving ship LOA.";
      }

      if (data.separation <= 0) {
        return "Recheck required lateral separation.";
      }

      if (data.deliverySpeed <= 0) {
        return "Recheck delivery ship RAS speed.";
      }

      if (data.receivingSpeed <= 0) {
        return "Recheck receiving ship approach speed.";
      }

      if (data.receivingSpeed <= data.deliverySpeed) {
        return "Receiving ship approach speed must be greater than delivery ship RAS speed.";
      }

      if (data.surgeRate < 0) {
        return "Recheck surge rate.";
      }

      return "";
    }

    function updateButton() {
      goBtn.classList.toggle(
        "valid",
        getValidationMessage() === ""
      );
    }

    function showWarning(message) {
      resultBox.innerHTML = `<span class="warning">${message}</span>`;
      printBtn.disabled = true;
      saveBtn.disabled = true;
    }

    function niceCeiling(value) {
      if (value <= 0) return 1;

      const exponent = Math.floor(Math.log10(value));
      const base = Math.pow(10, exponent);
      const normal = value / base;

      if (normal <= 1) return 1 * base;
      if (normal <= 2) return 2 * base;
      if (normal <= 5) return 5 * base;

      return 10 * base;
    }

    function makeLine(x1, y1, x2, y2, stroke, width, dash = "") {
      return `
        <line
          x1="${x1}"
          y1="${y1}"
          x2="${x2}"
          y2="${y2}"
          stroke="${stroke}"
          stroke-width="${width}"
          stroke-linecap="round"
          ${dash ? `stroke-dasharray="${dash}"` : ""}
        />
      `;
    }

    function makeText(x, y, text, size, anchor = "middle", fill = "#111", weight = "normal") {
      return `
        <text
          x="${x}"
          y="${y}"
          font-size="${size}"
          text-anchor="${anchor}"
          fill="${fill}"
          font-weight="${weight}"
          font-family="Arial, sans-serif"
        >${text}</text>
      `;
    }

    function renderGrid() {
      let grid = `
        <rect
          x="0"
          y="0"
          width="210"
          height="297"
          fill="#dff2d8"
        />
      `;

      for (let x = 0; x <= 210; x += 1) {
        const isMajor = x % 10 === 0;

        grid += makeLine(
          x,
          0,
          x,
          297,
          isMajor ? "#3b873b" : "#91c891",
          isMajor ? 0.18 : 0.06
        );
      }

      for (let y = 0; y <= 297; y += 1) {
        const isMajor = y % 10 === 0;

        grid += makeLine(
          0,
          y,
          210,
          y,
          isMajor ? "#3b873b" : "#91c891",
          isMajor ? 0.18 : 0.06
        );
      }

      return grid;
    }

    function shipPath(cx, stemY, loa, beam) {
      const halfBeam = beam / 2;
      const shoulderY = stemY + Math.min(loa * 0.12, 20);

      return `
        M ${cx} ${stemY}
        L ${cx + halfBeam} ${shoulderY}
        L ${cx + halfBeam} ${stemY + loa}
        L ${cx - halfBeam} ${stemY + loa}
        L ${cx - halfBeam} ${shoulderY}
        Z
      `;
    }

    function renderShip(options) {
      const {
        cx,
        stemY,
        loa,
        beam,
        standard,
        ras,
        label,
        rasSide,
        fill,
        stroke,
        dashed,
        opacity
      } = options;

      const halfBeam = beam / 2;
      const rasX = rasSide === "right" ? cx + halfBeam : cx - halfBeam;
      const rasY = stemY + ras;
      const standardY = stemY + standard;

      const rasLabelX = rasSide === "right" ? rasX + 5 : rasX - 5;
      const rasLabelAnchor = rasSide === "right" ? "start" : "end";

      return `
        <path
          d="${shipPath(cx, stemY, loa, beam)}"
          fill="${fill}"
          stroke="${stroke}"
          stroke-width="0.55"
          ${dashed ? `stroke-dasharray="2 1.5"` : ""}
          opacity="${opacity}"
        />

        ${makeLine(
          cx,
          stemY,
          cx,
          stemY + loa,
          stroke,
          0.25,
          "2 2"
        )}

        ${makeLine(
          cx - halfBeam,
          standardY,
          cx + halfBeam,
          standardY,
          stroke,
          0.25
        )}

        ${makeLine(
          cx - halfBeam,
          rasY,
          cx + halfBeam,
          rasY,
          stroke,
          0.25,
          "1.5 1.5"
        )}

        ${makeLine(
          cx - 1.6,
          rasY,
          cx + 1.6,
          rasY,
          stroke,
          0.45
        )}

        ${makeText(
          cx,
          stemY + loa + 7,
          label,
          4.2,
          "middle",
          stroke,
          "bold"
        )}

        ${makeText(
          cx,
          standardY - 2,
          "STANDARD",
          3.1,
          "middle",
          stroke
        )}

        <circle
          cx="${rasX}"
          cy="${rasY}"
          r="1.4"
          fill="${stroke}"
          opacity="${opacity}"
        />

        ${makeText(
          rasLabelX,
          rasY - 3,
          "RAS POINT",
          3.1,
          rasLabelAnchor,
          stroke
        )}
      `;
    }

    function renderCentreArrow(x1, y1, x2, y2, colour) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const length = Math.sqrt((dx * dx) + (dy * dy));

      if (length < 0.001) {
        return "";
      }

      const ux = dx / length;
      const uy = dy / length;

      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2;

      const arrowLength = 1.1;
      const arrowWidth = 0.9;

      const tipX = midX + (ux * arrowLength / 2);
      const tipY = midY + (uy * arrowLength / 2);

      const baseX = midX - (ux * arrowLength / 2);
      const baseY = midY - (uy * arrowLength / 2);

      const perpX = -uy;
      const perpY = ux;

      const leftX = baseX + (perpX * arrowWidth / 2);
      const leftY = baseY + (perpY * arrowWidth / 2);

      const rightX = baseX - (perpX * arrowWidth / 2);
      const rightY = baseY - (perpY * arrowWidth / 2);

      return `
        <polygon
          points="${tipX},${tipY} ${leftX},${leftY} ${rightX},${rightY}"
          fill="${colour}"
          stroke="${colour}"
          stroke-width="0.1"
        />
      `;
    }

    function renderRasGraph(data, build) {
      const a4WidthMm = 210;
      const a4HeightMm = 297;
      const paddingMm = 14;

      const delivery = {
        cx: build.deliveryCx,
        stemY: build.deliveryStemY,
        loa: data.deliveryLoa,
        beam: data.deliveryBeam
      };

      const receivingOrder = {
        cx: build.receivingCx,
        stemY: build.receivingOrderStemY,
        loa: data.receivingLoa,
        beam: data.receivingBeam
      };

      const receivingFinal = {
        cx: build.receivingCx,
        stemY: build.receivingFinalStemY,
        loa: data.receivingLoa,
        beam: data.receivingBeam
      };

      const xValues = [
        delivery.cx - delivery.beam / 2,
        delivery.cx + delivery.beam / 2,
        receivingOrder.cx - receivingOrder.beam / 2,
        receivingOrder.cx + receivingOrder.beam / 2,
        receivingFinal.cx - receivingFinal.beam / 2,
        receivingFinal.cx + receivingFinal.beam / 2
      ];

      const yValues = [
        delivery.stemY,
        delivery.stemY + delivery.loa,
        receivingOrder.stemY,
        receivingOrder.stemY + receivingOrder.loa,
        receivingFinal.stemY,
        receivingFinal.stemY + receivingFinal.loa
      ];

      let minX = Math.min(...xValues);
      let maxX = Math.max(...xValues);
      let minY = Math.min(...yValues);
      let maxY = Math.max(...yValues);

      const widthM = Math.max(10, maxX - minX);
      const heightM = Math.max(10, maxY - minY);

      const marginM = Math.max(
        20,
        Math.max(widthM, heightM) * 0.18
      );

      minX -= marginM;
      maxX += marginM;
      minY -= marginM;
      maxY += marginM;

      const graphWidthM = maxX - minX;
      const graphHeightM = maxY - minY;

      const usableWidthCm = (a4WidthMm - (2 * paddingMm)) / 10;
      const usableHeightCm = (a4HeightMm - (2 * paddingMm)) / 10;

      const scaleMPerCm = niceCeiling(
        Math.max(
          graphWidthM / usableWidthCm,
          graphHeightM / usableHeightCm
        ) * 1.03
      );

      const contentWidthMm = (graphWidthM / scaleMPerCm) * 10;
      const contentHeightMm = (graphHeightM / scaleMPerCm) * 10;

      const offsetX = (a4WidthMm - contentWidthMm) / 2;
      const offsetY = (a4HeightMm - contentHeightMm) / 2;

      function x(value) {
        return offsetX + ((value - minX) / scaleMPerCm) * 10;
      }

      function y(value) {
        return offsetY + ((value - minY) / scaleMPerCm) * 10;
      }

      function scaleLength(value) {
        return (value / scaleMPerCm) * 10;
      }

      const deliveryRasY = build.deliveryStemY + data.deliveryRas;
      const receivingOrderRasY = build.receivingOrderStemY + data.receivingRas;
      const receivingFinalRasY = build.receivingFinalStemY + data.receivingRas;

      const deliveryInnerSideX = build.deliveryCx - (data.deliveryBeam / 2);
      const receivingInnerSideX = build.receivingCx + (data.receivingBeam / 2);

      const orderReceivingRasX = build.receivingCx + (data.receivingBeam / 2);
      const deliveryRasX = build.deliveryCx - (data.deliveryBeam / 2);

      const northArrowX = 186;
      const northArrowY1 = 34;
      const northArrowY2 = 18;

      const svg = `
        <svg
          id="rasSvg"
          class="ras-svg"
          xmlns="http://www.w3.org/2000/svg"
          width="210mm"
          height="297mm"
          viewBox="0 0 210 297"
        >
          ${renderGrid()}

          ${makeText(
            12,
            10,
            `Scale: 1 cm = ${formatNumber(scaleMPerCm, 1)} m`,
            4,
            "start"
          )}

          ${makeText(
            12,
            16,
            `1 mm = ${formatNumber(scaleMPerCm / 10, 1)} m`,
            3.2,
            "start"
          )}

          ${makeLine(
            northArrowX,
            northArrowY1,
            northArrowX,
            northArrowY2,
            "#111",
            0.5
          )}

          ${renderCentreArrow(
            northArrowX,
            northArrowY1,
            northArrowX,
            northArrowY2,
            "#111"
          )}

          ${makeText(
            northArrowX,
            northArrowY2 - 3,
            "N",
            4,
            "middle"
          )}

          <g transform="translate(${x(0)}, ${y(0)}) scale(${scaleLength(1)})">
            ${renderShip({
              cx: build.deliveryCx,
              stemY: build.deliveryStemY,
              loa: data.deliveryLoa,
              beam: data.deliveryBeam,
              standard: data.deliveryStandard,
              ras: data.deliveryRas,
              label: "Delivery ship",
              rasSide: "left",
              fill: "rgba(20, 75, 150, 0.16)",
              stroke: "#0b4fbd",
              dashed: false,
              opacity: 1
            })}

            ${renderShip({
              cx: build.receivingCx,
              stemY: build.receivingOrderStemY,
              loa: data.receivingLoa,
              beam: data.receivingBeam,
              standard: data.receivingStandard,
              ras: data.receivingRas,
              label: "Receiving ship",
              rasSide: "right",
              fill: "rgba(138, 26, 26, 0.14)",
              stroke: "#8a1a1a",
              dashed: false,
              opacity: 1
            })}

            ${renderShip({
              cx: build.receivingCx,
              stemY: build.receivingFinalStemY,
              loa: data.receivingLoa,
              beam: data.receivingBeam,
              standard: data.receivingStandard,
              ras: data.receivingRas,
              label: "Receiving final position",
              rasSide: "right",
              fill: "rgba(90, 90, 90, 0.05)",
              stroke: "#555",
              dashed: true,
              opacity: 0.78
            })}

            ${makeLine(
              receivingInnerSideX,
              deliveryRasY,
              deliveryInnerSideX,
              deliveryRasY,
              "#111",
              0.5,
              "3 2"
            )}

            ${makeText(
              (receivingInnerSideX + deliveryInnerSideX) / 2,
              deliveryRasY - 5,
              `Lateral separation ${formatNumber(build.separationMetres, 1)} m`,
              4,
              "middle",
              "#111"
            )}

            ${makeLine(
              orderReceivingRasX,
              receivingOrderRasY,
              orderReceivingRasX,
              receivingFinalRasY,
              "#8a1a1a",
              0.7,
              "4 3"
            )}

            ${renderCentreArrow(
              orderReceivingRasX,
              receivingOrderRasY,
              orderReceivingRasX,
              receivingFinalRasY,
              "#8a1a1a"
            )}

            ${makeText(
              orderReceivingRasX - 8,
              (receivingOrderRasY + receivingFinalRasY) / 2,
              `S = ${formatNumber(build.surgeMetres, 1)} m`,
              4,
              "end",
              "#8a1a1a"
            )}

            ${makeLine(
              orderReceivingRasX,
              receivingOrderRasY,
              deliveryRasX,
              deliveryRasY,
              "#8a1a1a",
              0.35,
              "2 2"
            )}
          </g>

          ${makeText(
            12,
            258,
            `S = Surge rate × Speed difference`,
            3.5,
            "start",
            "#111",
            "bold"
          )}

          ${makeText(
            12,
            265,
            `Speed difference = ${formatNumber(build.speedDifference, 1)} kn`,
            3.4,
            "start",
            "#111"
          )}

          ${makeText(
            12,
            272,
            `Order down distance S = ${formatNumber(build.surgeYards, 1)} yds = ${formatNumber(build.surgeMetres, 1)} m`,
            3.4,
            "start",
            "#111"
          )}

          ${makeText(
            12,
            279,
            `Receiving RAS point is S abaft delivery RAS point at order-down position`,
            3.2,
            "start",
            "#111"
          )}
        </svg>
      `;

      return {
        svg,
        scaleMPerCm
      };
    }

    function calculate() {
      const validationMessage = getValidationMessage();

      if (validationMessage !== "") {
        showWarning(validationMessage);
        updateButton();
        return;
      }

      const data = getInputs();

      const separationMetres = getSeparationMetres(data);
      const centreLineSeparation =
        (data.receivingBeam / 2) +
        separationMetres +
        (data.deliveryBeam / 2);

      const speedDifference =
        data.receivingSpeed - data.deliverySpeed;

      const surgeYards =
        data.surgeRate * speedDifference;

      const surgeMetres =
        surgeYards * METRES_PER_YARD;

      const deliveryCx = centreLineSeparation / 2;
      const receivingCx = -centreLineSeparation / 2;

      const deliveryStemY = 0;
      const deliveryRasY = deliveryStemY + data.deliveryRas;

      const receivingFinalStemY =
        deliveryRasY - data.receivingRas;

      const receivingOrderStemY =
        receivingFinalStemY + surgeMetres;

      const build = {
        separationMetres,
        centreLineSeparation,
        speedDifference,
        surgeYards,
        surgeMetres,
        deliveryCx,
        receivingCx,
        deliveryStemY,
        receivingFinalStemY,
        receivingOrderStemY
      };

      const graph = renderRasGraph(data, build);

      resultBox.innerHTML = `
        <div class="success">RAS approach graph generated.</div>

        <div class="output-grid">
          <div class="output-box">
            <div class="output-label">Speed difference</div>
            <div class="output-value">${formatNumber(speedDifference, 1)} kn</div>
          </div>

          <div class="output-box">
            <div class="output-label">Order down distance S</div>
            <div class="output-value">${formatNumber(surgeYards, 1)} yds</div>
          </div>
        </div>

        <div class="graph-scroll">
          <div id="printArea" class="a4-sheet">
            ${graph.svg}
          </div>
        </div>
      `;

      printBtn.disabled = false;
      saveBtn.disabled = false;

      updateButton();
    }

    function printGraph() {
      const svg = document.getElementById("rasSvg");

      if (!svg) {
        return;
      }

      window.print();
    }

    function isIOSDevice() {
      return (
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (
          navigator.platform === "MacIntel" &&
          navigator.maxTouchPoints > 1
        )
      );
    }

    function createPngBlobFromSvg(svg) {
      return new Promise((resolve, reject) => {
        const serializer = new XMLSerializer();
        const svgText = serializer.serializeToString(svg);

        const svgBlob = new Blob(
          [svgText],
          {
            type: "image/svg+xml;charset=utf-8"
          }
        );

        const url = URL.createObjectURL(svgBlob);
        const image = new Image();

        image.onload = function () {
          const canvas = document.createElement("canvas");

          canvas.width = 2480;
          canvas.height = 3508;

          const context = canvas.getContext("2d");

          context.fillStyle = "#dff2d8";
          context.fillRect(0, 0, canvas.width, canvas.height);

          context.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
          );

          URL.revokeObjectURL(url);

          canvas.toBlob(
            function (blob) {
              if (!blob) {
                reject(new Error("Image creation failed."));
                return;
              }

              resolve(blob);
            },
            "image/png",
            1
          );
        };

        image.onerror = function () {
          URL.revokeObjectURL(url);
          reject(new Error("Image loading failed."));
        };

        image.src = url;
      });
    }

    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);

      const downloadLink = document.createElement("a");
      downloadLink.href = url;
      downloadLink.download = fileName;
      downloadLink.rel = "noopener";
      downloadLink.style.display = "none";

      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 2000);
    }

    function openBlobFallback(blob) {
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank", "noopener,noreferrer");

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 60000);
    }

    async function saveGraphAsImage() {
      const svg = document.getElementById("rasSvg");

      if (!svg) {
        return;
      }

      const fileName = "ras-approach-graph.png";

      try {
        const pngBlob = await createPngBlobFromSvg(svg);
        const pngFile = new File(
          [pngBlob],
          fileName,
          {
            type: "image/png"
          }
        );

        if (
          isIOSDevice() &&
          navigator.canShare &&
          navigator.share &&
          navigator.canShare({ files: [pngFile] })
        ) {
          await navigator.share({
            files: [pngFile],
            title: "RAS Approach Graph"
          });

          return;
        }

        downloadBlob(pngBlob, fileName);

        if (
          !isIOSDevice() &&
          navigator.canShare &&
          navigator.share &&
          navigator.canShare({ files: [pngFile] })
        ) {
          return;
        }
      } catch (error) {
        try {
          const pngBlob = await createPngBlobFromSvg(svg);
          const pngFile = new File(
            [pngBlob],
            "ras-approach-graph.png",
            {
              type: "image/png"
            }
          );

          if (
            navigator.canShare &&
            navigator.share &&
            navigator.canShare({ files: [pngFile] })
          ) {
            await navigator.share({
              files: [pngFile],
              title: "RAS Approach Graph"
            });

            return;
          }

          openBlobFallback(pngBlob);
        } catch (fallbackError) {
          resultBox.innerHTML =
            `<span class="warning">Image saving failed. Use Print A4 Graph and save as PDF from your browser.</span>`;
        }
      }
    }

    updateButton();
  </script>
</body>
</html>
