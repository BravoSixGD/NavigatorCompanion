<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RAS Approach Graph</title>

  <link rel="stylesheet" href="assets/theme.css">

  <style>
    .input-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .section-subtitle {
      font-size: clamp(16px, 3vw, 19px);
      font-weight: bold;
      color: var(--text-main);
      margin: 0 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-soft);
    }

    .input-section {
      margin-bottom: 18px;
    }

    .unit-row {
      display: grid;
      grid-template-columns: 1fr 0.65fr;
      gap: 10px;
      align-items: end;
    }

    .output-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .output-box {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 12px;
      padding: 14px;
      line-height: 1.5;
    }

    .output-label {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 5px;
    }

    .output-value {
      font-size: clamp(18px, 4vw, 25px);
      font-weight: bold;
      color: var(--text-main);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .action-btn {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 18px;
      font-weight: bold;
      background: var(--primary);
      cursor: pointer;
    }

    .action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    .graph-scroll {
      width: 100%;
      overflow: auto;
      margin-top: 16px;
      border: 1px solid var(--border-main);
      border-radius: 12px;
      background: var(--bg-input);
      padding: 10px;
    }

    .a4-sheet {
      width: 210mm;
      height: 297mm;
      background: #dff2d8;
      margin: 0 auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.45);
    }

    .ras-svg {
      display: block;
      width: 210mm;
      height: 297mm;
      background: #dff2d8;
    }

    @media (min-width: 760px) {
      .input-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .output-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .action-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      body {
        background: white;
        padding: 0;
        margin: 0;
      }

      body * {
        visibility: hidden;
      }

      #printArea,
      #printArea * {
        visibility: visible;
      }

      #printArea {
        position: fixed;
        left: 0;
        top: 0;
        width: 210mm;
        height: 297mm;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background: #dff2d8;
        box-shadow: none;
      }

      .a4-sheet {
        width: 210mm;
        height: 297mm;
        margin: 0;
        box-shadow: none;
      }

      .ras-svg {
        width: 210mm;
        height: 297mm;
      }
    }
  </style>
</head>

<body>
  <a href="index.html" class="home-btn" aria-label="Back to home">×</a>

  <div class="app-container">
    <h1 class="page-title">RAS Approach Graph</h1>

    <div class="card">
      <div class="card-title">Ship and Approach Data</div>

      <div class="input-section">
        <div class="section-subtitle">Delivery Ship</div>

        <div class="input-grid">
          <div>
            <label>Length overall in metres</label>
            <input id="deliveryLoa" class="input-field" type="number" inputmode="decimal" step="0.1" placeholder="170">
          </div>

          <div>
            <label>Stem to standard in metres</label>
            <input id="deliveryStandard" class="input-field" type="number" inputmode="decimal" step="0.1" placeholder="40">
          </div>

          <div>
            <label>Stem to RAS point in metres</label>
            <input id="deliveryRas" class="input-field" type="number" inputmode="decimal" step="0.1" placeholder="80">
          </div>

          <div>
            <label>Delivery ship speed in knots</label>
            <input id="deliverySpeed" class="input-field" type="number" inputmode="decimal" step="0.1" placeholder="12">
          </div>
        </div>
      </div>

      <div class="input-section">
        <div class="section-subtitle">Receiving Ship</div>

        <div class="input-grid">
          <div>
            <label>Length overall in metres</label>
            <input id="receivingLoa" class="input-field" type="number" inputmode="decimal" step="0.1" placeholder="150">
          </div>

          <div>
            <label>Stem to standard in metres</label>
            <input id="receivingStandard" class="input-field" type="number" inputmode="decimal" step="0.1" placeholder="35">
          </div>

          <div>
            <label>Stem to RAS point in metres</label>
            <input id="receivingRas" class="input-field" type="number" inputmode="decimal" step="0.1" placeholder="70">
          </div>

          <div>
            <label>Receiving approach speed in knots</label>
            <input id="receivingSpeed" class="input-field" type="number" inputmode="decimal" step="0.1" placeholder="15">
          </div>
        </div>
      </div>

      <div class="input-section">
        <div class="section-subtitle">RAS Parameters</div>

        <div class="input-grid">
          <div class="unit-row">
            <div>
              <label>Required lateral separation</label>
              <input id="lateralSeparation" class="input-field" type="number" inputmode="decimal" step="0.1" placeholder="120">
            </div>

            <div>
              <label>Unit</label>
              <select id="separationUnit" class="input-field">
                <option value="feet">feet</option>
                <option value="metres">metres</option>
              </select>
            </div>
          </div>

          <div>
            <label>Surge rate in yards per knot</label>
            <input id="surgeRate" class="input-field" type="number" inputmode="decimal" step="0.1" placeholder="80">
          </div>
        </div>
      </div>

      <button id="goBtn" class="go-btn" type="button">
        GO
      </button>

      <div class="action-grid">
        <button id="printBtn" class="action-btn" type="button" disabled>
          Print A4 Graph
        </button>

        <button id="saveBtn" class="action-btn" type="button" disabled>
          Save as Image
        </button>
      </div>

      <div id="result" class="result">
        Enter values to plot RAS approach graph.
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const FEET_TO_METRES = 0.3048;
    const YARDS_TO_METRES = 0.9144;

    const goBtn = document.getElementById("goBtn");
    const printBtn = document.getElementById("printBtn");
    const saveBtn = document.getElementById("saveBtn");
    const resultBox = document.getElementById("result");

    const inputIds = [
      "deliveryLoa",
      "deliveryStandard",
      "deliveryRas",
      "deliverySpeed",
      "receivingLoa",
      "receivingStandard",
      "receivingRas",
      "receivingSpeed",
      "lateralSeparation",
      "surgeRate"
    ];

    document.querySelectorAll(".input-field").forEach((control) => {
      control.addEventListener("input", updateGoButton);
      control.addEventListener("change", updateGoButton);
    });

    goBtn.addEventListener("click", calculateGraph);
    printBtn.addEventListener("click", printGraph);
    saveBtn.addEventListener("click", saveGraphAsImage);

    function readNumber(id) {
      const text = document.getElementById(id).value.trim();
      return text === "" ? Number.NaN : Number(text);
    }

    function getInputs() {
      return {
        deliveryLoa: readNumber("deliveryLoa"),
        deliveryStandard: readNumber("deliveryStandard"),
        deliveryRas: readNumber("deliveryRas"),
        deliverySpeed: readNumber("deliverySpeed"),

        receivingLoa: readNumber("receivingLoa"),
        receivingStandard: readNumber("receivingStandard"),
        receivingRas: readNumber("receivingRas"),
        receivingSpeed: readNumber("receivingSpeed"),

        lateralSeparation: readNumber("lateralSeparation"),
        separationUnit: document.getElementById("separationUnit").value,

        surgeRate: readNumber("surgeRate")
      };
    }

    function formatNumber(value, decimals = 1) {
      return Number(value).toFixed(decimals);
    }

    function trimNumber(value, decimals = 1) {
      return Number(value)
        .toFixed(decimals)
        .replace(/\.0$/, "");
    }

    function getValidationMessage() {
      const data = getInputs();

      for (const id of inputIds) {
        const value = readNumber(id);

        if (!Number.isFinite(value)) {
          return "Complete all input fields.";
        }
      }

      if (data.deliveryLoa <= 0 || data.receivingLoa <= 0) {
        return "Length overall must be more than zero.";
      }

      if (data.deliveryStandard < 0 || data.deliveryStandard > data.deliveryLoa) {
        return "Recheck delivery ship stem to standard.";
      }

      if (data.deliveryRas < 0 || data.deliveryRas > data.deliveryLoa) {
        return "Recheck delivery ship stem to RAS point.";
      }

      if (data.receivingStandard < 0 || data.receivingStandard > data.receivingLoa) {
        return "Recheck receiving ship stem to standard.";
      }

      if (data.receivingRas < 0 || data.receivingRas > data.receivingLoa) {
        return "Recheck receiving ship stem to RAS point.";
      }

      if (data.deliverySpeed <= 0 || data.receivingSpeed <= 0) {
        return "Speeds must be more than zero.";
      }

      if (data.receivingSpeed <= data.deliverySpeed) {
        return "Receiving approach speed must be more than delivery ship speed.";
      }

      if (data.lateralSeparation < 0) {
        return "Recheck lateral separation.";
      }

      if (data.surgeRate < 0) {
        return "Recheck surge rate.";
      }

      return "";
    }

    function updateGoButton() {
      const valid = getValidationMessage() === "";
      goBtn.classList.toggle("valid", valid);
    }

    function separationToMetres(value, unit) {
      if (unit === "feet") {
        return value * FEET_TO_METRES;
      }

      return value;
    }

    function makePoint(x, y) {
      return {
        x,
        y
      };
    }

    function calculateRasConstruction(data) {
      const lateralClearanceM = separationToMetres(
        data.lateralSeparation,
        data.separationUnit
      );

      const speedDifference = data.receivingSpeed - data.deliverySpeed;

      const surgeM =
        data.surgeRate *
        speedDifference *
        YARDS_TO_METRES;

      const deliveryY = 0;
      const receivingY =
        data.deliveryLoa * 0 +
        lateralClearanceM;

      const deliveryRasX = data.deliveryRas;
      const receivingFinalRasX = deliveryRasX;

      const receivingFinalStemX =
        receivingFinalRasX - data.receivingRas;

      const receivingOrderStemX =
        receivingFinalStemX - surgeM;

      return {
        lateralClearanceM,
        speedDifference,
        surgeM,

        delivery: {
          stem: makePoint(0, deliveryY),
          stern: makePoint(data.deliveryLoa, deliveryY),
          standard: makePoint(data.deliveryStandard, deliveryY),
          ras: makePoint(data.deliveryRas, deliveryY)
        },

        receivingFinal: {
          stem: makePoint(receivingFinalStemX, receivingY),
          stern: makePoint(receivingFinalStemX + data.receivingLoa, receivingY),
          standard: makePoint(receivingFinalStemX + data.receivingStandard, receivingY),
          ras: makePoint(receivingFinalStemX + data.receivingRas, receivingY)
        },

        receivingOrder: {
          stem: makePoint(receivingOrderStemX, receivingY),
          stern: makePoint(receivingOrderStemX + data.receivingLoa, receivingY),
          standard: makePoint(receivingOrderStemX + data.receivingStandard, receivingY),
          ras: makePoint(receivingOrderStemX + data.receivingRas, receivingY)
        }
      };
    }

    function niceCeiling(value) {
      if (value <= 0) return 1;

      const exponent = Math.floor(Math.log10(value));
      const base = Math.pow(10, exponent);
      const normal = value / base;

      if (normal <= 1) return 1 * base;
      if (normal <= 2) return 2 * base;
      if (normal <= 5) return 5 * base;

      return 10 * base;
    }

    function makeLine(x1, y1, x2, y2, stroke, width, dash = "") {
      return `
        <line
          x1="${x1}"
          y1="${y1}"
          x2="${x2}"
          y2="${y2}"
          stroke="${stroke}"
          stroke-width="${width}"
          stroke-linecap="round"
          ${dash ? `stroke-dasharray="${dash}"` : ""}
        />
      `;
    }

    function makeText(x, y, text, size, anchor = "middle", fill = "#111", weight = "normal") {
      return `
        <text
          x="${x}"
          y="${y}"
          font-size="${size}"
          text-anchor="${anchor}"
          fill="${fill}"
          font-family="Arial, sans-serif"
          font-weight="${weight}"
        >${text}</text>
      `;
    }

    function renderGrid() {
      let grid = `
        <rect
          x="0"
          y="0"
          width="210"
          height="297"
          fill="#dff2d8"
        />
      `;

      for (let x = 0; x <= 210; x += 1) {
        const isMajor = x % 10 === 0;

        grid += makeLine(
          x,
          0,
          x,
          297,
          isMajor ? "#3b873b" : "#91c891",
          isMajor ? 0.18 : 0.06
        );
      }

      for (let y = 0; y <= 297; y += 1) {
        const isMajor = y % 10 === 0;

        grid += makeLine(
          0,
          y,
          210,
          y,
          isMajor ? "#3b873b" : "#91c891",
          isMajor ? 0.18 : 0.06
        );
      }

      return grid;
    }

    function renderCentreArrow(x1, y1, x2, y2, colour) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const length = Math.sqrt((dx * dx) + (dy * dy));

      if (length < 0.001) {
        return "";
      }

      const ux = dx / length;
      const uy = dy / length;

      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2;

      const arrowLength = 1.1;
      const arrowWidth = 0.9;

      const tipX = midX + (ux * arrowLength / 2);
      const tipY = midY + (uy * arrowLength / 2);

      const baseX = midX - (ux * arrowLength / 2);
      const baseY = midY - (uy * arrowLength / 2);

      const perpX = -uy;
      const perpY = ux;

      const leftX = baseX + (perpX * arrowWidth / 2);
      const leftY = baseY + (perpY * arrowWidth / 2);

      const rightX = baseX - (perpX * arrowWidth / 2);
      const rightY = baseY - (perpY * arrowWidth / 2);

      return `
        <polygon
          points="${tipX},${tipY} ${leftX},${leftY} ${rightX},${rightY}"
          fill="${colour}"
          stroke="${colour}"
          stroke-width="0.1"
        />
      `;
    }

    function renderCircle(x, y, fill) {
      return `
        <circle
          cx="${x}"
          cy="${y}"
          r="0.55"
          fill="${fill}"
          stroke="#111"
          stroke-width="0.15"
        />
      `;
    }

    function renderShip(label, ship, mapX, mapY, colour, dashed = false) {
      const stemX = mapX(ship.stem.x);
      const stemY = mapY(ship.stem.y);

      const sternX = mapX(ship.stern.x);
      const sternY = mapY(ship.stern.y);

      const standardX = mapX(ship.standard.x);
      const standardY = mapY(ship.standard.y);

      const rasX = mapX(ship.ras.x);
      const rasY = mapY(ship.ras.y);

      const dash = dashed ? "3 2" : "";

      let output = "";

      output += makeLine(
        stemX,
        stemY,
        sternX,
        sternY,
        colour,
        0.7,
        dash
      );

      output += renderCentreArrow(
        stemX,
        stemY,
        sternX,
        sternY,
        colour
      );

      output += makeLine(
        standardX,
        standardY - 2.7,
        standardX,
        standardY + 2.7,
        colour,
        0.5,
        dash
      );

      output += makeLine(
        rasX,
        rasY - 4.2,
        rasX,
        rasY + 4.2,
        colour,
        0.65,
        dash
      );

      output += renderCircle(
        stemX,
        stemY,
        colour
      );

      output += renderCircle(
        sternX,
        sternY,
        colour
      );

      output += renderCircle(
        standardX,
        standardY,
        "#f2a900"
      );

      output += renderCircle(
        rasX,
        rasY,
        "#ff0000"
      );

      output += makeText(
        (stemX + sternX) / 2,
        stemY - 6,
        label,
        3.4,
        "middle",
        colour,
        "bold"
      );

      output += makeText(
        rasX,
        rasY + 8,
        "RAS",
        3,
        "middle",
        "#111"
      );

      output += makeText(
        standardX,
        standardY + 8,
        "STD",
        3,
        "middle",
        "#111"
      );

      return output;
    }

    function renderRasGraph(data, build) {
      const a4WidthMm = 210;
      const a4HeightMm = 297;
      const paddingMm = 18;

      const allPoints = [
        build.delivery.stem,
        build.delivery.stern,
        build.delivery.standard,
        build.delivery.ras,

        build.receivingFinal.stem,
        build.receivingFinal.stern,
        build.receivingFinal.standard,
        build.receivingFinal.ras,

        build.receivingOrder.stem,
        build.receivingOrder.stern,
        build.receivingOrder.standard,
        build.receivingOrder.ras
      ];

      let minX = Math.min(...allPoints.map(point => point.x));
      let maxX = Math.max(...allPoints.map(point => point.x));
      let minY = Math.min(...allPoints.map(point => point.y));
      let maxY = Math.max(...allPoints.map(point => point.y));

      const widthM = Math.max(1, maxX - minX);
      const heightM = Math.max(1, maxY - minY);

      const marginM = Math.max(20, Math.max(widthM, heightM) * 0.25);

      minX -= marginM;
      maxX += marginM;
      minY -= marginM;
      maxY += marginM;

      const graphWidthM = maxX - minX;
      const graphHeightM = maxY - minY;

      const usableWidthCm = (a4WidthMm - (2 * paddingMm)) / 10;
      const usableHeightCm = (a4HeightMm - (2 * paddingMm)) / 10;

      const scaleMPerCm = niceCeiling(
        Math.max(
          graphWidthM / usableWidthCm,
          graphHeightM / usableHeightCm
        ) * 1.03
      );

      const contentWidthMm = (graphWidthM / scaleMPerCm) * 10;
      const contentHeightMm = (graphHeightM / scaleMPerCm) * 10;

      const offsetX = (a4WidthMm - contentWidthMm) / 2;
      const offsetY = (a4HeightMm - contentHeightMm) / 2;

      function mapX(value) {
        return offsetX + ((value - minX) / scaleMPerCm) * 10;
      }

      function mapY(value) {
        return offsetY + ((maxY - value) / scaleMPerCm) * 10;
      }

      const deliveryRasX = mapX(build.delivery.ras.x);
      const deliveryRasY = mapY(build.delivery.ras.y);

      const receivingOrderRasX = mapX(build.receivingOrder.ras.x);
      const receivingOrderRasY = mapY(build.receivingOrder.ras.y);

      const receivingFinalRasX = mapX(build.receivingFinal.ras.x);
      const receivingFinalRasY = mapY(build.receivingFinal.ras.y);

      const northArrowX = 186;
      const northArrowY1 = 34;
      const northArrowY2 = 18;

      const svg = `
        <svg
          id="rasSvg"
          class="ras-svg"
          xmlns="http://www.w3.org/2000/svg"
          width="210mm"
          height="297mm"
          viewBox="0 0 210 297"
        >
          ${renderGrid()}

          ${makeText(12, 10, `Scale: 1 cm = ${formatNumber(scaleMPerCm, 1)} m`, 4, "start")}
          ${makeText(12, 16, `1 mm = ${formatNumber(scaleMPerCm / 10, 1)} m`, 3.2, "start")}

          ${makeLine(northArrowX, northArrowY1, northArrowX, northArrowY2, "#111", 0.5)}
          ${renderCentreArrow(northArrowX, northArrowY1, northArrowX, northArrowY2, "#111")}
          ${makeText(northArrowX, northArrowY2 - 3, "N", 4, "middle")}

          ${renderShip(
            "Delivery ship",
            build.delivery,
            mapX,
            mapY,
            "#0b4fbd",
            false
          )}

          ${renderShip(
            "Receiving ship order-down position",
            build.receivingOrder,
            mapX,
            mapY,
            "#8a1a1a",
            false
          )}

          ${renderShip(
            "Receiving ship final position",
            build.receivingFinal,
            mapX,
            mapY,
            "#555555",
            true
          )}

          ${makeLine(
            receivingOrderRasX,
            receivingOrderRasY,
            receivingFinalRasX,
            receivingFinalRasY,
            "#8a1a1a",
            0.5,
            "2 2"
          )}

          ${renderCentreArrow(
            receivingOrderRasX,
            receivingOrderRasY,
            receivingFinalRasX,
            receivingFinalRasY,
            "#8a1a1a"
          )}

          ${makeLine(
            deliveryRasX,
            deliveryRasY,
            receivingFinalRasX,
            receivingFinalRasY,
            "#111",
            0.45,
            "2 2"
          )}

          ${makeText(
            (receivingOrderRasX + receivingFinalRasX) / 2,
            receivingOrderRasY - 5,
            `Surge = ${formatNumber(build.surgeM, 1)} m`,
            3.2,
            "middle",
            "#8a1a1a"
          )}

          ${makeText(
            12,
            268,
            `Speed difference = ${formatNumber(build.speedDifference, 1)} kn`,
            3.5,
            "start",
            "#111",
            "bold"
          )}

          ${makeText(
            12,
            275,
            `Surge = ${formatNumber(build.surgeM, 1)} m`,
            3.5,
            "start",
            "#111",
            "bold"
          )}

          ${makeText(
            12,
            282,
            `Required lateral separation = ${formatNumber(build.lateralClearanceM, 1)} m`,
            3.5,
            "start",
            "#111",
            "bold"
          )}
        </svg>
      `;

      return {
        svg,
        scaleMPerCm
      };
    }

    function calculateGraph() {
      const validationMessage = getValidationMessage();

      if (validationMessage !== "") {
        resultBox.innerHTML =
          `<span class="warning">${validationMessage}</span>`;

        printBtn.disabled = true;
        saveBtn.disabled = true;
        updateGoButton();
        return;
      }

      const data = getInputs();
      const build = calculateRasConstruction(data);
      const graph = renderRasGraph(data, build);

      resultBox.innerHTML = `
        <div class="success">RAS approach graph calculated.</div>

        <div class="output-grid">
          <div class="output-box">
            <div class="output-label">Speed difference</div>
            <div class="output-value">${formatNumber(build.speedDifference, 1)} kn</div>
          </div>

          <div class="output-box">
            <div class="output-label">Surge</div>
            <div class="output-value">${formatNumber(build.surgeM, 1)} m</div>
          </div>
        </div>

        <div class="graph-scroll">
          <div id="printArea" class="a4-sheet">
            ${graph.svg}
          </div>
        </div>
      `;

      printBtn.disabled = false;
      saveBtn.disabled = false;

      updateGoButton();
    }

    function printGraph() {
      const svg = document.getElementById("rasSvg");

      if (!svg) {
        return;
      }

      window.print();
    }

    function isIOSDevice() {
      return (
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (
          navigator.platform === "MacIntel" &&
          navigator.maxTouchPoints > 1
        )
      );
    }

    function getRasGraphSvg() {
      return (
        document.getElementById("rasSvg") ||
        document.getElementById("graphSvg") ||
        document.querySelector("#printArea svg") ||
        document.querySelector(".a4-sheet svg") ||
        document.querySelector("svg")
      );
    }

    function createPngBlobFromSvg(svg) {
      return new Promise((resolve, reject) => {
        const serializer = new XMLSerializer();
        const svgText = serializer.serializeToString(svg);

        const svgBlob = new Blob(
          [svgText],
          {
            type: "image/svg+xml;charset=utf-8"
          }
        );

        const url = URL.createObjectURL(svgBlob);
        const image = new Image();

        image.onload = function () {
          const canvas = document.createElement("canvas");

          canvas.width = 2480;
          canvas.height = 3508;

          const context = canvas.getContext("2d");

          context.fillStyle = "#dff2d8";
          context.fillRect(0, 0, canvas.width, canvas.height);

          context.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
          );

          URL.revokeObjectURL(url);

          canvas.toBlob(
            function (blob) {
              if (!blob) {
                reject(new Error("Image creation failed."));
                return;
              }

              resolve(blob);
            },
            "image/png",
            1
          );
        };

        image.onerror = function () {
          URL.revokeObjectURL(url);
          reject(new Error("Image loading failed."));
        };

        image.src = url;
      });
    }

    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);

      const downloadLink = document.createElement("a");
      downloadLink.href = url;
      downloadLink.download = fileName;
      downloadLink.rel = "noopener";
      downloadLink.style.display = "none";

      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 2000);
    }

    function openBlobFallback(blob) {
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank", "noopener,noreferrer");

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 60000);
    }

    async function saveGraphAsImage() {
      const svg = getRasGraphSvg();

      if (!svg) {
        return;
      }

      const fileName = "ras-approach-graph.png";

      try {
        const pngBlob = await createPngBlobFromSvg(svg);

        const pngFile = new File(
          [pngBlob],
          fileName,
          {
            type: "image/png"
          }
        );

        if (
          isIOSDevice() &&
          navigator.canShare &&
          navigator.share &&
          navigator.canShare({ files: [pngFile] })
        ) {
          await navigator.share({
            files: [pngFile],
            title: "RAS Approach Graph"
          });

          return;
        }

        downloadBlob(pngBlob, fileName);
      } catch (error) {
        try {
          const pngBlob = await createPngBlobFromSvg(svg);

          const pngFile = new File(
            [pngBlob],
            fileName,
            {
              type: "image/png"
            }
          );

          if (
            navigator.canShare &&
            navigator.share &&
            navigator.canShare({ files: [pngFile] })
          ) {
            await navigator.share({
              files: [pngFile],
              title: "RAS Approach Graph"
            });

            return;
          }

          openBlobFallback(pngBlob);
        } catch (fallbackError) {
          resultBox.classList.remove("hidden");
          resultBox.innerHTML =
            `<span class="warning">Image saving failed. Use Print A4 Graph and save as PDF from your browser.</span>`;
        }
      }
    }

    updateGoButton();
  </script>
</body>
</html>
